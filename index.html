<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cortex — Gehirntraining</title>

<!-- ===== PWA / Home-Screen ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E9ECF2">
<meta name="color-scheme" content="light">
<meta name="description" content="Persönliches Gehirntraining: Kopfrechnen, Logik, GMAT und Working Memory mit adaptiver Schwierigkeit.">
<!-- iOS: als Vollbild-App vom Home-Screen starten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cortex">
<meta name="application-name" content="Cortex">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Theme vor dem ersten Paint setzen (kein FOUC). Liest DENSELBEN Store-Key, keine parallele Logik. -->
<script>(function(){try{
  var raw=localStorage.getItem('cortex:data:v1');
  var choice=raw?((JSON.parse(raw)||{}).settings||{}).theme:null; if(!choice)choice='light';
  var dark = choice==='dark' || (choice==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var r = dark?'dark':'light';
  document.documentElement.setAttribute('data-theme', r);
  var mc=document.querySelector('meta[name="theme-color"]'); if(mc)mc.setAttribute('content', dark?'#0F1420':'#E9ECF2');
  var cs=document.querySelector('meta[name="color-scheme"]'); if(cs)cs.setAttribute('content', r);
}catch(e){}})();</script>
<style>
  :root{
    --bg:#E9ECF2; --surface:#FFFFFF; --ink:#141B2D; --muted:#5B6577; --faint:#8B94A6;
    --accent:#2F4BFF; --accent-soft:#E5E9FF; --good:#0E9F6E; --good-soft:#E2F5ED;
    --bad:#E11D48; --bad-soft:#FCE4EA; --warn:#B7791F; --warn-soft:#FBF1DD; --line:#D7DCE6;
    /* zusaetzliche semantische Tokens (Default = helles Design, unveraendert) */
    --card:#FFFFFF; --soft:#FBFCFE; --input-bg:#FFFFFF; --on-accent:#FFFFFF;
    --chip-active-bg:#141B2D; --chip-active-fg:#FFFFFF; --toast-bg:#141B2D; --toast-fg:#FFFFFF;
    color-scheme:light;
    --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  /* ===== Dunkles Design – nur Variablen-Overrides, keine Layoutaenderung ===== */
  html[data-theme="dark"]{
    --bg:#0F1420; --surface:#191F2E; --card:#191F2E; --ink:#E7EAF1; --muted:#9AA4B8; --faint:#6B7488;
    --accent:#7C93FF; --accent-soft:#242E4A; --good:#34D399; --good-soft:#122A20;
    --bad:#FB7185; --bad-soft:#2A1620; --warn:#E0B44B; --warn-soft:#2A2314; --line:#2A3242;
    --soft:#20283A; --input-bg:#121826; --on-accent:#0F1420;
    --chip-active-bg:#E7EAF1; --chip-active-fg:#141B2D; --toast-bg:#E7EAF1; --toast-fg:#141B2D;
    color-scheme:dark;
  }
  /* Sichtbare Tastatur-Fokuszustaende in beiden Themes */
  button:focus-visible,.chip:focus-visible,.opt:focus-visible,input:focus-visible,a:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    min-height:100%;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
    -webkit-user-select:none;user-select:none}
  /* Eingaben & Erklärtexte bleiben markierbar */
  input,.q-text,.explain,.tip-text{-webkit-user-select:text;user-select:text}
  button{touch-action:manipulation}
  .app{width:100%;max-width:560px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
  .brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  .bar-right{display:flex;align-items:center;gap:12px}
  .tag{font-size:12px;color:var(--faint);font-family:var(--mono);letter-spacing:.04em}
  .home-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
    padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .14s;white-space:nowrap}
  .home-btn:hover{border-color:var(--accent);color:var(--accent)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;
    box-shadow:0 1px 2px rgba(20,27,45,.04),0 12px 28px -18px rgba(20,27,45,.18)}

  .lede{font-size:15px;line-height:1.55;color:var(--muted);margin-bottom:22px}
  .lede b{color:var(--ink);font-weight:600}
  .cat-list{display:flex;flex-direction:column;gap:12px}
  .cat{width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:16px;
    transition:border-color .15s,transform .12s,box-shadow .15s;font:inherit;color:inherit}
  .cat:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 10px 22px -16px rgba(47,75,255,.5)}
  .cat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cat-mark{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);background:var(--accent-soft);
    border-radius:9px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cat-body{flex:1;min-width:0}
  .cat-title{font-family:var(--display);font-weight:600;font-size:15.5px}
  .cat-desc{font-size:12.5px;color:var(--muted);margin-top:2px}
  .cat-stat{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right;flex:0 0 auto}
  .cat-stat b{display:block;color:var(--good);font-size:14px}

  .head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px;
    cursor:pointer;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:border-color .15s}
  .back:hover{border-color:var(--accent);color:var(--accent)}
  .head h2{font-family:var(--display);font-size:18px;font-weight:600}

  .seclabel{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:13px;
    cursor:pointer;font:inherit;color:var(--muted);transition:all .15s}
  .chip[aria-pressed="true"]{background:var(--chip-active-bg);color:var(--chip-active-fg);border-color:var(--chip-active-bg)}

  .topics{display:flex;flex-direction:column;gap:9px}
  .topic{border:1px solid var(--line);border-radius:13px;padding:13px 15px;display:flex;align-items:center;gap:12px}
  .topic-info{flex:1;min-width:0}
  .topic-info b{font-family:var(--display);font-weight:600;font-size:14.5px}
  .topic-info span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .topic-actions{display:flex;gap:7px;flex:0 0 auto}
  .mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 13px;font-size:12.5px;min-height:40px;
    cursor:pointer;font-family:var(--body);color:var(--muted);transition:all .14s;white-space:nowrap}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .mini.solid{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
  .mini.solid:hover{filter:brightness(1.07);color:var(--on-accent)}
  .mini.done{border-color:var(--good);color:var(--good)}

  .primer{border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:18px;background:var(--soft)}
  .primer .pk{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .primer p{font-size:14.5px;line-height:1.6;color:var(--ink);margin-bottom:16px}
  .primer p:last-child{margin-bottom:0}
  .primer .ex{font-family:var(--mono);font-size:13.5px;background:var(--accent-soft);border-radius:9px;padding:11px 13px;color:var(--ink)}

  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}
  .dot.on{background:var(--accent)}
  .tut-ex{font-family:var(--mono);font-size:clamp(20px,6vw,30px);text-align:center;margin:4px 0 16px;word-break:break-word}
  .step{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.5;padding:11px 0;border-bottom:1px solid var(--line);animation:rise .25s ease both}
  .step:last-child{border-bottom:none}
  .step .sn{font-family:var(--mono);font-weight:700;color:var(--accent);flex:0 0 auto}
  .done-badge{text-align:center;font-size:44px;color:var(--good);margin:6px 0 4px}

  .btn{width:100%;border:none;border-radius:12px;padding:15px;cursor:pointer;font-family:var(--display);font-weight:600;
    font-size:15px;background:var(--accent);color:var(--on-accent);transition:filter .15s,transform .1s}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
  .btn-row{display:flex;gap:10px;margin-top:14px}

  .session-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
  .streak{color:var(--accent)} .streak.cold{color:var(--faint)}
  .progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:24px}
  .progress > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}

  .qwrap{animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .qkind{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;margin-bottom:12px}
  .q-math{font-family:var(--mono);font-weight:500;font-size:clamp(26px,8vw,44px);line-height:1.2;text-align:center;margin:14px 0 24px;word-break:break-word}
  .q-math sup{font-size:.6em} .q-math sub{font-size:.55em}
  .q-text{font-size:16px;line-height:1.55;margin-bottom:20px}
  .q-text sup{font-size:.7em}
  .q-text .stmt{display:block;margin-top:10px;padding-left:14px;border-left:2px solid var(--accent-soft)}

  .num-input{width:100%;text-align:center;font-family:var(--mono);font-size:30px;font-weight:500;border:1.5px solid var(--line);
    border-radius:14px;padding:16px;color:var(--ink);transition:border-color .15s;background:var(--input-bg)}
  .num-input:focus{outline:none;border-color:var(--accent)}
  /* ---- Bruch-Eingabe (Zaehler/Nenner, optional Ganzzahl) ---- */
  .frac-input{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 2px}
  .frac-cell{width:104px;text-align:center;font-family:var(--mono);font-size:26px;font-weight:500;
    border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;color:var(--ink);background:var(--input-bg);transition:border-color .15s}
  .frac-cell:focus{outline:none;border-color:var(--accent)}
  .frac-cell:disabled{opacity:.85}
  .frac-cell::placeholder{color:var(--faint);font-size:14px;font-family:var(--body)}
  .frac-whole{width:74px}
  .frac-stack{display:flex;flex-direction:column;gap:6px}
  .frac-bar{height:2px;background:var(--ink);border-radius:2px;margin:1px 4px}
  /* ---- x/y-Eingabe fuer Gleichungssysteme ---- */
  .xy-input{display:flex;flex-direction:column;gap:10px;align-items:center;margin:8px 0 2px}
  .xy-row{display:flex;align-items:center;gap:10px}
  .xy-lab{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--muted);width:34px;text-align:right}
  .xy-cell{width:150px;text-align:center;font-family:var(--mono);font-size:24px;font-weight:500;
    border:1.5px solid var(--line);border-radius:12px;padding:11px 8px;color:var(--ink);background:var(--input-bg);transition:border-color .15s}
  .xy-cell:focus{outline:none;border-color:var(--accent)}
  .xy-cell:disabled{opacity:.85}
  .xy-cell::placeholder{color:var(--faint)}
  /* ---- Coach-Karte ---- */
  .coach-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .coach-tag{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:3px 10px;border-radius:999px}
  .coach-dur{font-size:12px;color:var(--muted)}
  .coach-main{font-size:16px;font-weight:600;color:var(--ink);line-height:1.42}
  .coach-focus{font-size:13px;color:var(--muted);margin-top:5px}
  .coach-reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .coach-reason{font-size:12px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
  .coach-note{font-size:12.5px;color:var(--muted);margin-top:9px}
  .coach-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .coach-hint{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.4}
  .coach-strategy{font-size:12.5px;color:var(--ink);background:var(--accent-soft);border-radius:9px;padding:8px 11px;margin-top:10px;line-height:1.5}
  .coach-tipview{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;padding:0 0 0 4px;cursor:pointer;white-space:nowrap}
  /* ---- Gedankentipps ---- */
  .mt-entry{border:1.5px dashed var(--accent);background:var(--accent-soft)}
  .mt-filters{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
  .mt-card{border:1px solid var(--line);border-radius:13px;background:var(--soft);margin-bottom:10px;overflow:hidden}
  .mt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:13px 14px;background:none;border:none;text-align:left;cursor:pointer;color:var(--ink)}
  .mt-title{font-size:14.5px;font-weight:600;line-height:1.35}
  .mt-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
  .mt-cat{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .mt-mode{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .mt-lvl{font-size:10.5px;color:var(--faint)}
  .mt-sum{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}
  .mt-ex{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:7px;word-break:break-word}
  .mt-caret{color:var(--faint);font-size:15px;flex-shrink:0;transition:transform .15s}
  .mt-card.open .mt-caret{transform:rotate(90deg)}
  .mt-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
  .mt-card.open .mt-body{display:block}
  .mt-expl{font-size:13.5px;color:var(--ink);line-height:1.5;margin-top:11px}
  .mt-steps{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--input-bg);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.7;
    word-break:break-word;overflow-wrap:anywhere}
  .mt-result{font-size:13px;font-weight:600;color:var(--good);margin-top:8px}
  .mt-mnemo{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:8px}
  .mt-applies{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .mt-applies span{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .mt-empty{font-size:13px;color:var(--muted);text-align:center;padding:22px 8px}
  /* ---- Gedankentipp im Aufgabenfeedback (Stufe 2) ---- */
  .fbtip{margin-top:12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:11px;
    background:var(--soft);padding:11px 13px;text-align:left}
  .fbtip-head{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .fbtip-title{font-size:14px;font-weight:600;color:var(--ink);margin-top:4px}
  .fbtip-sum{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
  .fbtip-mnemo{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:5px}
  .fbtip-more{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:8px 0 2px;cursor:pointer}
  .fbtip-ex{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px;word-break:break-word}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px;
    cursor:pointer;font:inherit;font-size:14.5px;color:var(--ink);display:flex;gap:12px;align-items:flex-start;
    transition:border-color .12s,background .12s;line-height:1.45}
  .opt:hover{border-color:var(--accent)}
  .opt .key{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);flex:0 0 auto;margin-top:1px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .key{color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .key{color:var(--bad)}
  .opt:disabled{cursor:default}

  .tiprow{margin-top:14px}
  .tip-btn{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:10px;
    padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:filter .14s}
  .tip-btn:hover{filter:brightness(.97)}
  .tip-text{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:11px 13px}
  .tip-text:empty{display:none}
  .tip-text b{color:var(--warn)}

  .feedback{min-height:24px;margin-top:16px;font-size:14px;font-weight:500;text-align:center}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
  .explain{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px;font-weight:400}

  .res-score{font-family:var(--mono);font-weight:700;font-size:60px;text-align:center;line-height:1;letter-spacing:-.02em}
  .res-score small{font-size:24px;color:var(--faint)}
  .res-label{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 4px}
  .res-note{text-align:center;color:var(--accent);font-size:13px;font-family:var(--mono);margin-bottom:22px}
  .res-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:22px}
  .res-cell{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .res-cell b{font-family:var(--mono);font-size:20px;display:block}
  .res-cell span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
  .best{text-align:center;font-size:13px;color:var(--accent);margin-bottom:18px;font-weight:500}
  .area-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:8px;font-size:13.5px}
  .area-row.strong{border-color:var(--good);background:var(--good-soft)}
  .area-row.weak{border-color:var(--warn);background:var(--warn-soft)}
  .area-name{font-weight:600} .area-meta{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .rec{font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--accent-soft);border-radius:11px;padding:13px 15px;margin:8px 0 18px}

<body>
<div class="app">
  <div class="bar">
    <div class="brand">Cor<span>tex</span></div>
    <div class="bar-right"><button id="homeBtn" class="home-btn" hidden>🏠 Home</button><div class="tag" id="tag">dein training</div></div>
  </div>
  <div id="root"></div>
  <div class="foot">Cortex · Daten lokal auf diesem Gerät</div>
</div>

<script>
/* ========= Helfer ========= */
const APP_VERSION='1.11.0';   // einzige Quelle der Versionsnummer (Footer, Einstellungen, Service-Worker-Cache)
const fmt = n => (typeof n==='number') ? n.toLocaleString('de-DE') : n;
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const clamp = (x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const gcd = (a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const fracStr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?`${n}`:`${n}/${d}`;};
const fact=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r;};
const norm=s=>s.replace(/[\s,]/g,'').toUpperCase();

/* =========================================================
   ZENTRALE SPEICHERUNG
   Alles läuft über EINEN Store, der beim Start einmal geladen
   und danach synchron benutzt wird. Persistiert wird die ganze
   App-State als ein JSON-Blob unter einem Schlüssel.
========================================================= */
const STORE_KEY='cortex:data:v1';
const MEM={};                                  // Fallback, falls localStorage gesperrt ist (Privatmodus)

/* ---- Persistenz-Backend -------------------------------------------------
   >>> EINZIGE Stelle, die für Capacitor (Phase 2) angepasst wird. <<<
   Aktuell: localStorage. Später Capacitor Preferences – die App bleibt
   unverändert, weil load()/save() schon async sind:

     import { Preferences } from '@capacitor/preferences';
     const Backend = {
       async load(){ const { value } = await Preferences.get({ key: STORE_KEY }); return value; },
       async save(str){ await Preferences.set({ key: STORE_KEY, value: str }); }
     };
   Kein weiterer Umbau nötig.
-------------------------------------------------------------------------- */
const Backend = {
  async load(){ try{ const v=localStorage.getItem(STORE_KEY); return v!=null?v:(MEM[STORE_KEY]??null); }catch(e){ return MEM[STORE_KEY]??null; } },
  async save(str){ try{ localStorage.setItem(STORE_KEY,str); }catch(e){ MEM[STORE_KEY]=str; } }
};

function defaultData(){return{version:1,best:{},profile:{},tut:{},streak:{last:null,current:0,best:0,history:[]},settings:{},mathProfile:null,cfaProfile:null,gmatProfile:null,wmComboProfile:null};}
function safeParse(s){try{const d=JSON.parse(s);return (d&&typeof d==='object')?d:null;}catch(e){return null;}}

// Alt-Daten (frühere Einzelschlüssel) einmalig in den Blob übernehmen – kein Datenverlust beim Update.
function migrateLegacy(){
  try{
    const d=defaultData();let found=false;
    const prof=localStorage.getItem('cortex:profile:v1');if(prof){const p=safeParse(prof);if(p){d.profile=p;found=true;}}
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
      if(k&&k.startsWith('cortex:best:')){const v=safeParse(localStorage.getItem(k));if(v){d.best[k.slice(12)]=v;found=true;}}
      else if(k&&k.startsWith('cortex:tut:')){if(localStorage.getItem(k)==='1'){d.tut[k.slice(11)]=true;found=true;}}
    }
    return found?d:null;
  }catch(e){return null;}
}

const Store = {
  data:null,_t:null,
  async init(){
    const raw=await Backend.load();
    let d=raw?safeParse(raw):null;
    if(!d){ d=migrateLegacy()||defaultData(); }
    // fehlende Felder ergänzen (Vorwärtskompatibilität)
    const base=defaultData(); for(const k in base) if(d[k]===undefined) d[k]=base[k];
    if(!d.streak) d.streak=base.streak;
    this.data=d; await this._save();
  },
  persist(){ clearTimeout(this._t); this._t=setTimeout(()=>this._save(),150); },   // gedrosselt, ein einziger Timer
  flush(){ clearTimeout(this._t); this._t=null; return this._save(); },               // sofort schreiben (Backgrounding)
  async _save(){ await Backend.save(JSON.stringify(this.data)); },
  exportString(){ return JSON.stringify(this.data,null,2); },
  async importString(str){ const d=safeParse(str); if(!d||typeof d!=='object'||!('profile'in d||'best'in d)) throw new Error('invalid');
    const base=defaultData(); for(const k in base) if(d[k]===undefined) d[k]=base[k];
    this.data=d; await this._save(); }
};

/* ---- Typisierte Helfer (lesen/schreiben synchron aus dem Blob) ---- */
function loadBest(k){ return Store.data.best[k]||null; }
function saveBest(k,v){ Store.data.best[k]=v; Store.persist(); }
function tutDone(k){ return !!Store.data.tut[k]; }
function markTut(k){ Store.data.tut[k]=true; Store.persist(); }

/* ---- Theme (hell / dunkel / system) – Auswahl im Store unter settings.theme ---- */
function themeChoice(){ const s=Store.data&&Store.data.settings; return (s&&s.theme)||'light'; }   // Default: hell
function resolveTheme(choice){ if(choice==='system')return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; return choice==='dark'?'dark':'light'; }
function applyTheme(){ const r=resolveTheme(themeChoice());
  document.documentElement.setAttribute('data-theme',r);
  const mc=document.querySelector('meta[name="theme-color"]'); if(mc)mc.setAttribute('content', r==='dark'?'#0F1420':'#E9ECF2');
  const cs=document.querySelector('meta[name="color-scheme"]'); if(cs)cs.setAttribute('content', r); }
function setTheme(choice){ if(['light','dark','system'].indexOf(choice)<0)choice='light';
  Store.data.settings=Store.data.settings||{}; Store.data.settings.theme=choice; Store.persist(); applyTheme(); }

/* ---- Streak- / Tagesmodell (echte Kalendertage, YYYY-MM-DD) ---- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const Streak = {
  today(){ return ymd(new Date()); },
  state(){ return Store.data.streak; },
  doneToday(){ return Store.data.streak.last===this.today(); },
  effectiveCurrent(){ const s=Store.data.streak,t=this.today(),y=ymd(addDays(new Date(),-1)); return (s.last===t||s.last===y)?s.current:0; },
  // zählt höchstens EINMAL pro Kalendertag
  registerToday(){
    const s=Store.data.streak,t=this.today();
    if(s.last===t) return;                       // heute schon gezählt
    const y=ymd(addDays(new Date(),-1));
    s.current=(s.last===y)?s.current+1:1;        // gestern trainiert → +1, sonst Neustart bei 1
    s.best=Math.max(s.best||0,s.current);
    s.last=t;
    s.history=[...(s.history||[]),t].slice(-60); // letzte 60 Trainingstage
    Store.persist();
  }
};

/* ---- Export / Import --------------------------------------------------
   Browser/PWA: Download via Blob, Import via <input type=file>.
   CAPACITOR (Phase 2): hier stattdessen @capacitor/filesystem + @capacitor/share
   bzw. einen File-Picker nutzen – Logik (Store.exportString/importString) bleibt gleich.
-------------------------------------------------------------------------- */
function exportData(){
  try{
    const blob=new Blob([Store.exportString()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='cortex-backup-'+Streak.today()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Backup heruntergeladen');
  }catch(e){ toast('Export nicht möglich'); }
}
function importData(file){
  const r=new FileReader();
  r.onload=async()=>{ try{ await Store.importString(String(r.result)); loadProfile(); toast('Daten importiert'); home(); }
    catch(e){ toast('Ungültige Datei'); } };
  r.onerror=()=>toast('Datei konnte nicht gelesen werden');
  r.readAsText(file);
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},1900);
}

/* ========= MATHE =========
   gen(L) → {prompt, answer, hints:[t1,t2], explain, disp?, text?}
   tut    → {concept, ex, example, steps[]}  (didaktische Einführung)
*/
const MATH = {
  chain:{name:"Add./Sub.-Ketten", teaser:"Mehrere Plus/Minus in Folge",
    tut:{concept:"Beim Kettenrechnen wertest du mehrere Plus- und Minus-Schritte nacheinander aus. Es gibt keine Vorrangregeln – du arbeitest strikt von links nach rechts und führst dabei ein laufendes Zwischenergebnis mit.",ex:"48 + 27 − 13 = 62",example:"48 + 27 − 13",steps:["Nimm die erste Zahl: 48.","Addiere 27 → 75.","Ziehe 13 ab → 62. Fertig."]},
    gen:(L)=>{const c={1:{n:3,lo:5,hi:30},2:{n:3,lo:10,hi:60},3:{n:4,lo:10,hi:90},4:{n:5,lo:15,hi:120}}[L];
      let t=rnd(c.lo,c.hi),parts=[''+t];for(let i=1;i<c.n;i++){let v=rnd(c.lo,c.hi);if(t-v>=0&&Math.random()<.5){t-=v;parts.push('− '+v);}else{t+=v;parts.push('+ '+v);}}
      const p=parts.join(' ');return{prompt:p,answer:t,hints:["Arbeite strikt von links nach rechts.","Rechne nur die ersten beiden Zahlen aus, merke dir das Ergebnis, dann die nächste – nie alles auf einmal."],explain:`Von links: ${p} = ${fmt(t)}.`};}},
  mulS:{name:"Kleines 1×1", teaser:"Faktoren 1–10",
    tut:{concept:"Das kleine Einmaleins sind alle Produkte der Zahlen 1 bis 10. Sitzt es sicher, wird fast jede andere Rechnung schneller. Schwierige Paare lassen sich elegant zerlegen.",ex:"7 × 8 = 56",example:"7 × 8",steps:["Direkt schwer? Zerlege: 7 × 8 = 7 × (10 − 2).","7 × 10 = 70, 7 × 2 = 14.","70 − 14 = 56."]},
    gen:(L)=>{const r={1:[2,5],2:[2,9],3:[6,10],4:[2,12]}[L];const a=rnd(r[0],r[1]),b=rnd(r[0],r[1]);return{prompt:`${a} × ${b}`,answer:a*b,hints:["Zerlege den größeren Faktor in 10er.","z. B. 7 × 8 = 7 × 10 − 7 × 2 = 70 − 14."],explain:`${a} × ${b} = ${a*b}.`};}},
  mulB:{name:"Großes 1×1", teaser:"Faktoren 11–25",
    tut:{concept:"Beim großen Einmaleins zerlegst du einen Faktor in Zehner + Rest und addierst die beiden Teilprodukte. So bleibt jede einzelne Multiplikation klein.",ex:"14 × 16 = 224",example:"14 × 16",steps:["Zerlege 16 in 10 + 6.","14 × 10 = 140, 14 × 6 = 84.","140 + 84 = 224."]},
    gen:(L)=>{const hi={1:15,2:18,3:20,4:25}[L];const a=rnd(11,hi),b=rnd(11,hi);return{prompt:`${a} × ${b}`,answer:a*b,hints:["Zerlege einen Faktor in 10 + Rest.",`${a} × ${b} = ${a} × 10 + ${a} × ${b-10}.`],explain:`${a} × ${b} = ${a*b}.`};}},
  sqrt:{name:"Wurzeln", teaser:"Quadrat- & Kubikwurzel",
    tut:{concept:"Die Quadratwurzel √a fragt: Welche Zahl ergibt mit sich selbst multipliziert a? Bei Quadratzahlen ist das Ergebnis ganzzahlig. Die Kubikwurzel ∛a fragt nach dem Faktor, der dreimal multipliziert a ergibt.",ex:"√196 = 14",example:"√196",steps:["Welche Zahl mal sich selbst ergibt 196?","13² = 169 (zu klein), 14² = 196.","Also √196 = 14."]},
    gen:(L)=>{if(L>=3&&Math.random()<(L===4?.5:1)){const n=rnd(2,L===4?7:6);return{prompt:`∛${n*n*n}`,answer:n,hints:["Welche Zahl ergibt dreimal multipliziert das Radikand?","Probiere kleine Zahlen: 2³=8, 3³=27, 4³=64 …"],explain:`${n}³ = ${n*n*n}, also ∛${n*n*n} = ${n}.`};}
      const n=rnd(2,{1:10,2:15,3:18,4:25}[L]);return{prompt:`√${n*n}`,answer:n,hints:["Welche Zahl mit sich selbst ergibt das Radikand?","Schätze: 10×10=100, 12×12=144, 14×14=196 – nähere dich an."],explain:`${n}² = ${n*n}, also √${n*n} = ${n}.`};}},
  pow:{name:"Potenzen", teaser:"Basis hoch Exponent",
    tut:{concept:"Eine Potenz a^n bedeutet: die Basis a wird n-mal mit sich selbst multipliziert. Der Exponent zählt also die Faktoren.",ex:"2⁴ = 16",example:"2⁴",steps:["Exponent 4 = vier Faktoren der Basis 2.","2 × 2 = 4, × 2 = 8, × 2 = 16.","2⁴ = 16."]},
    gen:(L)=>{let a,b;if(L===1){a=rnd(2,9);b=2;}else if(L===2){a=rnd(2,9);b=rnd(2,3);}else if(L===3){a=rnd(2,6);b=rnd(2,4);}else{a=2;b=rnd(5,10);}
      return{prompt:`${a}<sup>${b}</sup>`,answer:Math.pow(a,b),hints:["Basis so oft multiplizieren, wie der Exponent angibt.",`Schrittweise: ${a} × ${a} = ${a*a}, dann weiter mit ${a}.`],explain:`${Array(b).fill(a).join(' × ')} = ${fmt(Math.pow(a,b))}.`};}},
  frac:{name:"Brüche", teaser:"Addieren, multiplizieren, kürzen",
    tut:{concept:"Brüche addierst du nur bei gleichem Nenner – sonst bringst du sie zuvor auf einen gemeinsamen Nenner. Multipliziert wird Zähler × Zähler und Nenner × Nenner. Ergebnisse kürzt man so weit wie möglich.",ex:"1/4 + 1/6 = 5/12",example:"1/4 + 1/6",steps:["Gemeinsamer Nenner: 4 × 6 = 24.","1/4 = 6/24, 1/6 = 4/24.","6/24 + 4/24 = 10/24 = 5/12."]},
    gen:(L)=>{if(L<=2){let d1,d2;if(L===1){d1=d2=rnd(2,9);}else{d1=rnd(2,6);d2=rnd(2,6);}const n1=rnd(1,d1-1),n2=rnd(1,d2-1),num=n1*d2+n2*d1,den=d1*d2;
        return{prompt:`${n1}/${d1} + ${n2}/${d2}`,answer:num/den,disp:fracStr(num,den),answerType:"fraction",hints:[d1===d2?"Gleicher Nenner – nur die Zähler addieren.":"Auf einen gemeinsamen Nenner bringen.",d1===d2?"Am Ende kürzen, falls möglich.":`Gemeinsamer Nenner ${d1*d2}: erweitere beide Brüche darauf.`],explain:`= ${num}/${den} = ${fracStr(num,den)}.`};}
      const d1=rnd(2,6),d2=rnd(2,6),n1=rnd(1,d1-1),n2=rnd(1,d2-1);
      if(L===3){const num=n1*n2,den=d1*d2;return{prompt:`${n1}/${d1} × ${n2}/${d2}`,answer:num/den,disp:fracStr(num,den),answerType:"fraction",hints:["Zähler × Zähler, Nenner × Nenner.","Danach kürzen: suche gemeinsame Teiler von Zähler und Nenner."],explain:`= ${num}/${den} = ${fracStr(num,den)}.`};}
      let A=[n1,d1],B=[n2,d2];if(n1/d1<n2/d2){A=[n2,d2];B=[n1,d1];}const num=A[0]*B[1]-B[0]*A[1],den=A[1]*B[1];
      return{prompt:`${A[0]}/${A[1]} − ${B[0]}/${B[1]}`,answer:num/den,disp:fracStr(num,den),answerType:"fraction",hints:["Auf gemeinsamen Nenner bringen, dann die Zähler subtrahieren.",`Gemeinsamer Nenner ${A[1]*B[1]}; erst erweitern, dann abziehen.`],explain:`= ${num}/${den} = ${fracStr(num,den)}.`};}},
  equations:{name:"Gleichungen", teaser:"Nach x auflösen · Umkehroperationen",
    tut:{concept:"Bei einer Gleichung suchst du die Zahl für x. Du formst um, indem du auf beiden Seiten dieselbe Umkehroperation anwendest: Plus ↔ Minus, Mal ↔ Geteilt. Ziel ist, dass x allein steht.",
      ex:"2x + 5 = 17 → x = 6", example:"2x + 5 = 17",
      steps:["Zuerst 5 abziehen: 2x = 12.","Dann durch 2 teilen: x = 6.","Probe: 2·6 + 5 = 17 ✓."]},
    gen:(L)=>{
      const R=(a,b)=>rnd(a,b);
      if(L<=1){ const v=pick(['add','sub','mul','div']);
        if(v==='add'){const x=R(1,12),a=R(1,12);return{prompt:`x + ${a} = ${x+a}`,answer:x,type:'lin_add',hints:["Auf beiden Seiten die Zahl abziehen.",`x = ${x+a} − ${a}.`],explain:`Umkehrung von +${a}: x = ${x+a} − ${a} = ${x}.`};}
        if(v==='sub'){const x=R(3,15),a=R(1,x-1);return{prompt:`x − ${a} = ${x-a}`,answer:x,type:'lin_sub',hints:["Auf beiden Seiten die Zahl addieren.",`x = ${x-a} + ${a}.`],explain:`Umkehrung von −${a}: x = ${x-a} + ${a} = ${x}.`};}
        if(v==='mul'){const x=R(2,9),a=R(2,9);return{prompt:`x · ${a} = ${a*x}`,answer:x,type:'lin_mul',hints:["Auf beiden Seiten durch die Zahl teilen.",`x = ${a*x} / ${a}.`],explain:`Umkehrung von ·${a}: x = ${a*x} / ${a} = ${x}.`};}
        const a=R(2,9),b=R(2,9),x=a*b;return{prompt:`x / ${a} = ${b}`,answer:x,type:'lin_div',hints:["Auf beiden Seiten mit der Zahl malnehmen.",`x = ${b} · ${a}.`],explain:`Umkehrung von /${a}: x = ${b} · ${a} = ${x}.`};
      }
      if(L===2){ const v=pick(['coef','divx','sub']);
        if(v==='coef'){const a=R(2,9),x=R(2,12);return{prompt:`${a}x = ${a*x}`,answer:x,type:'lin_coef',hints:["ax bedeutet a·x – durch a teilen.",`x = ${a*x} / ${a}.`],explain:`x = ${a*x} / ${a} = ${x}.`};}
        if(v==='divx'){const a=R(2,9),x=R(2,9),b=a*x;return{prompt:`${b} / x = ${a}`,answer:x,type:'lin_divx',hints:["Erst mit x malnehmen, dann durch die Zahl teilen.",`x = ${b} / ${a}.`],explain:`${b} / x = ${a} → x = ${b} / ${a} = ${x}.`};}
        const a=R(3,12),x=R(a+2,a+15);return{prompt:`x − ${a} = ${x-a}`,answer:x,type:'lin_sub',hints:["Die Zahl auf beiden Seiten addieren.",`x = ${x-a} + ${a}.`],explain:`x = ${x-a} + ${a} = ${x}.`};
      }
      if(L===3){ const v=pick(['axpb','axmb','xdapb']);
        if(v==='axpb'){const a=R(2,6),x=R(2,12),b=R(1,15);return{prompt:`${a}x + ${b} = ${a*x+b}`,answer:x,type:'two_add',hints:[`Erst ${b} abziehen, dann durch ${a} teilen.`,`x = (${a*x+b} − ${b}) / ${a}.`],explain:`${a}x = ${a*x+b} − ${b} = ${a*x}; x = ${a*x} / ${a} = ${x}.`};}
        if(v==='axmb'){const a=R(2,6),x=R(2,12),b=R(1,a*x-1);return{prompt:`${a}x − ${b} = ${a*x-b}`,answer:x,type:'two_sub',hints:[`Erst ${b} addieren, dann durch ${a} teilen.`,`x = (${a*x-b} + ${b}) / ${a}.`],explain:`${a}x = ${a*x-b} + ${b} = ${a*x}; x = ${a*x} / ${a} = ${x}.`};}
        const a=R(2,6),q=R(2,10),x=a*q,b=R(1,12);return{prompt:`x / ${a} + ${b} = ${q+b}`,answer:x,type:'two_divadd',hints:[`Erst ${b} abziehen, dann mit ${a} malnehmen.`,`x = (${q+b} − ${b}) · ${a}.`],explain:`x / ${a} = ${q+b} − ${b} = ${q}; x = ${q} · ${a} = ${x}.`};
      }
      // L4: gemischter, negative Lösungen möglich
      const v=pick(['paren','both','axmb']);
      if(v==='paren'){const a=R(2,5),x=R(1,10),b=R(1,6);return{prompt:`${a}(x + ${b}) = ${a*(x+b)}`,answer:x,signed:true,type:'paren',hints:[`Erst durch ${a} teilen, dann ${b} abziehen.`,`x = ${a*(x+b)} / ${a} − ${b}.`],explain:`x + ${b} = ${a*(x+b)} / ${a} = ${x+b}; x = ${x+b} − ${b} = ${x}.`};}
      if(v==='both'){const x=R(-6,10),c=R(2,4),k=R(1,3),a=c+k,b=R(1,10),d=k*x+b,dTerm=d>0?`+ ${d}`:(d<0?`− ${-d}`:'');
        return{prompt:`${a}x + ${b} = ${c}x${dTerm?' '+dTerm:''}`,answer:x,signed:true,type:'both_sides',hints:["Alle x auf eine Seite, Zahlen auf die andere.",`(${a}−${c})x = ${d} − ${b} → ${k}x = ${d-b}.`],explain:`${a}x − ${c}x = ${d} − ${b} → ${k}x = ${d-b} → x = ${x}.`};}
      const a=R(2,6),x=R(1,10),b=R(1,15);return{prompt:`${a}x − ${b} = ${a*x-b}`,answer:x,signed:true,type:'two_sub',hints:[`Erst ${b} addieren, dann durch ${a} teilen.`,`x = (${a*x-b} + ${b}) / ${a}.`],explain:`${a}x = ${a*x-b} + ${b} = ${a*x}; x = ${a*x} / ${a} = ${x}.`};
    }},
  linsys:{name:"Gleichungssysteme", teaser:"2\u00d72 \u00b7 x und y bestimmen",
    tut:{concept:"Ein Gleichungssystem hat zwei Gleichungen mit zwei Unbekannten (x und y). Du l\u00f6st es durch Einsetzen (eine Gleichung nach x oder y umstellen und einsetzen) oder durch Addieren/Subtrahieren der Gleichungen, sodass eine Variable wegf\u00e4llt.",
      ex:"x + y = 7 \u00b7 x \u2212 y = 3 \u2192 x = 5, y = 2", example:"x + y = 7 \u00b7 x \u2212 y = 3",
      steps:["Beide Gleichungen addieren: 2x = 10 \u2192 x = 5.","x einsetzen: 5 + y = 7 \u2192 y = 2.","L\u00f6sung: x = 5, y = 2."]},
    gen:(L)=>{
      const R=(a,b)=>rnd(a,b);
      const mk=(a,b,c,d,x,y,type,h,e)=>({prompt:`${fmtLin(a,b,a*x+b*y)}<br>${fmtLin(c,d,c*x+d*y)}`,answerType:'xy',ansX:x,ansY:y,disp:`x = ${x}, y = ${y}`,type,hints:h,explain:e});
      if(L<=1){ const x=R(1,9),y=R(1,9);
        return Math.random()<0.5
          ? mk(1,1,1,0,x,y,'given_x',["x ist direkt gegeben.",`y = ${x+y} \u2212 ${x}.`],`x = ${x}; y = ${x+y} \u2212 ${x} = ${y}.`)
          : mk(1,1,0,1,x,y,'given_y',["y ist direkt gegeben.",`x = ${x+y} \u2212 ${y}.`],`y = ${y}; x = ${x+y} \u2212 ${y} = ${x}.`);
      }
      if(L===2){
        if(Math.random()<0.5){ const x=R(3,9),y=R(1,x-1);
          return mk(1,1,1,-1,x,y,'add_sub',["Beide Gleichungen addieren \u2013 y f\u00e4llt weg.",`2x = ${2*x} \u2192 x = ${x}.`],`Addieren: 2x = ${2*x} \u2192 x = ${x}; y = ${x+y} \u2212 ${x} = ${y}.`); }
        const a=R(2,3),x=R(2,6),y=R(1,9);
        return mk(a,1,1,0,x,y,'subst',["x ist gegeben \u2013 einsetzen.",`${a}\u00b7${x} + y = ${a*x+y} \u2192 y = ${y}.`],`x = ${x}; ${a}\u00b7${x} + y = ${a*x+y} \u2192 y = ${y}.`);
      }
      if(L===3){ const x=R(2,7),y=R(1,7);
        return Math.random()<0.5
          ? mk(2,1,1,1,x,y,'elim1',["Zweite von erster abziehen \u2013 y f\u00e4llt weg.",`x = ${(2*x+y)-(x+y)} = ${x}.`],`Subtrahieren: x = ${(2*x+y)-(x+y)} = ${x}; y = ${x+y} \u2212 ${x} = ${y}.`)
          : mk(3,2,1,1,x,y,'elim2',["Erste minus 2\u00b7zweite \u2013 y f\u00e4llt weg.",`x = ${(3*x+2*y)-2*(x+y)} = ${x}.`],`x = ${(3*x+2*y)-2*(x+y)} = ${x}; y = ${x+y} \u2212 ${x} = ${y}.`);
      }
      // L4: etwas schwieriger, kleine negative L\u00f6sungen m\u00f6glich
      const x=R(-3,8),y=R(-3,8);
      const q=Math.random()<0.5
        ? mk(2,3,1,1,x,y,'elim3',["Erste minus 2\u00b7zweite \u2192 y.",`y = ${(2*x+3*y)-2*(x+y)} = ${y}.`],`y = ${(2*x+3*y)-2*(x+y)} = ${y}; x = ${x+y} \u2212 ${y} = ${x}.`)
        : mk(3,-1,1,2,x,y,'elim4',["Erste \u00d72, dann addieren \u2192 7x.",`7x = ${7*x} \u2192 x = ${x}.`],`7x = ${2*(3*x-y)+(x+2*y)} \u2192 x = ${x}; y = (${x+2*y} \u2212 ${x})/2 = ${y}.`);
      q.signed=true; return q;
    }},
  pct:{name:"Prozent", teaser:"Anteile von hundert",
    tut:{concept:"Prozent heißt „von hundert“. p % einer Zahl findest du, indem du die Zahl durch 100 teilst (das ist 1 %) und dann mit p multiplizierst.",ex:"20 % von 80 = 16",example:"20 % von 80",steps:["1 % von 80 = 0,8.","20 % = 20 × 0,8.","= 16."]},
    gen:(L)=>{if(L===4){const base=pick([40,60,80,120,160,200,240]),p=pick([10,20,25,50]),val=base*p/100;return{prompt:`${fmt(val)} ist ${p}% von ?`,answer:base,hints:["Hier ist der Anteil bekannt, gesucht ist das Ganze.",`${fmt(val)} sind ${p} %. Teile durch ${p} → 1 %, dann × 100.`],explain:`${fmt(val)} ÷ ${p} × 100 = ${fmt(base)}.`};}
      const s={1:{p:[10,25,50],b:[40,60,80,120,200]},2:{p:[5,15,20,75],b:[60,80,120,160,240,200]},3:{p:[5,10,15,20,25,30,40],b:[20,40,60,80,120,160,240,300]}}[L];const p=pick(s.p),base=pick(s.b);
      return{prompt:`${p}% von ${base}`,answer:base*p/100,hints:["1 % ist der Hundertstel der Zahl.",`1 % von ${base} = ${base/100}; davon ${p}-mal.`],explain:`${base} ÷ 100 × ${p} = ${fmt(base*p/100)}.`};}},
  area:{name:"Flächen", teaser:"Rechteck, Dreieck, mehr",
    tut:{concept:"Die Fläche misst, wie viel Raum eine Figur einnimmt. Jede Grundform hat ihre Formel: Rechteck = Länge × Breite, Quadrat = Seite², Dreieck = ½ × Grundseite × Höhe, Parallelogramm = Grundseite × Höhe.",ex:"Dreieck, Grundseite 6, Höhe 4 → 12",example:"Dreieck · Grundseite 6 · Höhe 4",steps:["Formel: ½ × Grundseite × Höhe.","½ × 6 × 4 = ½ × 24.","= 12."]},
    gen:(L)=>{const sh={rect:()=>{const l=rnd(3,14),w=rnd(2,12);return{p:`Rechteck mit Länge ${l} und Breite ${w}`,a:l*w,h:"Fläche = Länge × Breite.",e:`${l} × ${w} = ${l*w}.`};},
        square:()=>{const s=rnd(3,15);return{p:`Quadrat mit Seitenlänge ${s}`,a:s*s,h:"Fläche = Seite × Seite.",e:`${s}² = ${s*s}.`};},
        tri:()=>{let b=rnd(3,16),h=rnd(2,12);if((b*h)%2)h++;return{p:`Dreieck mit Grundseite ${b} und Höhe ${h}`,a:b*h/2,h:"Fläche = ½ × Grundseite × Höhe.",e:`½ × ${b} × ${h} = ${b*h/2}.`};},
        para:()=>{const b=rnd(4,14),h=rnd(3,10);return{p:`Parallelogramm mit Grundseite ${b} und Höhe ${h}`,a:b*h,h:"Fläche = Grundseite × Höhe.",e:`${b} × ${h} = ${b*h}.`};}};
      const pool={1:['rect'],2:['rect','square'],3:['rect','square','tri'],4:['rect','square','tri','para']}[L];const s=sh[pick(pool)]();
      return{text:true,prompt:s.p,answer:s.a,hints:["Welche Formel passt zur genannten Figur?",s.h],explain:s.e};}},
  log:{name:"Logarithmus", teaser:"Umkehrung der Potenz",
    tut:{concept:"Der Logarithmus ist die Umkehrung der Potenz. log_b(x) fragt: Mit welchem Exponenten muss ich die Basis b potenzieren, um x zu erhalten?",ex:"log₂(32) = 5",example:"log₂(32)",steps:["Frage: 2 hoch was = 32?","2, 4, 8, 16, 32 → fünf Verdopplungen.","2⁵ = 32, also log₂(32) = 5."]},
    gen:(L)=>{let b,k;if(L===1){b=2;k=rnd(1,6);}else if(L===2){b=10;k=rnd(1,4);}else if(L===3){b=pick([2,3,5]);k=rnd(2,4);}else{b=pick([2,3,5,10]);k=rnd(2,4);}
      const val=Math.pow(b,k);return{prompt:`log<sub>${b}</sub>(${fmt(val)})`,answer:k,hints:["Die Basis hoch wie viel ergibt das Argument?",`Liste die Potenzen von ${b} auf: ${b}, ${b*b}, ${b*b*b} … bis du ${fmt(val)} triffst.`],explain:`${b}^${k} = ${fmt(val)}, also log_${b}(${fmt(val)}) = ${k}.`};}},
  factorial:{name:"Fakultät", teaser:"n! = 1 × 2 × … × n",
    tut:{concept:"Die Fakultät n! ist das Produkt aller ganzen Zahlen von 1 bis n. Sie zählt z. B., auf wie viele Arten man n Dinge anordnen kann.",ex:"5! = 120",example:"5!",steps:["5! = 1 × 2 × 3 × 4 × 5.","1×2=2, ×3=6, ×4=24, ×5=120.","5! = 120."]},
    gen:(L)=>{const n=rnd({1:2,2:2,3:3,4:5}[L],{1:5,2:6,3:7,4:9}[L]);const chain=Array.from({length:n},(_,i)=>i+1).join(' × ');return{prompt:`${n}!`,answer:fact(n),hints:["n! = 1 × 2 × … × n.","Multipliziere fortlaufend: Zwischenergebnis × nächste Zahl."],explain:`${chain} = ${fmt(fact(n))}.`};}},
  sum:{name:"Summen (Σ)", teaser:"Reihen aufsummieren",
    tut:{concept:"Das Summenzeichen Σ steht für die Addition vieler Glieder. Für 1 bis n gibt es die Gauß-Formel: (erste + letzte) × Anzahl ÷ 2.",ex:"1 + … + 10 = 55",example:"1 + 2 + … + 10",steps:["Gauß: (erste + letzte) × Anzahl ÷ 2.","(1 + 10) × 10 ÷ 2.","110 ÷ 2 = 55."]},
    gen:(L)=>{if(L===3){const a=rnd(3,12),b=a+rnd(4,12),cnt=b-a+1,s=(a+b)*cnt/2;return{text:true,prompt:`${a} + ${a+1} + … + ${b}`,answer:s,hints:["(erste + letzte) × Anzahl ÷ 2.",`Anzahl der Glieder = ${b} − ${a} + 1 = ${cnt}.`],explain:`(${a} + ${b}) × ${cnt} ÷ 2 = ${fmt(s)}.`};}
      if(L===4){const n=rnd(4,10),s=n*(n+1);return{text:true,prompt:`2 + 4 + 6 + … + ${2*n}`,answer:s,hints:["Gerade Zahlen: klammere die 2 aus.",`= 2 × (1 + 2 + … + ${n}).`],explain:`2 × ${n*(n+1)/2} = ${fmt(s)}.`};}
      const n=rnd(L===1?4:10,L===1?10:20),s=n*(n+1)/2;return{text:true,prompt:`1 + 2 + 3 + … + ${n}`,answer:s,hints:["Nutze die Gauß-Formel statt einzeln zu addieren.",`n × (n+1) ÷ 2 mit n = ${n}.`],explain:`${n} × ${n+1} ÷ 2 = ${fmt(s)}.`};}},
  prod:{name:"Produkte (Π)", teaser:"Faktorenfolgen",
    tut:{concept:"Das Produktzeichen Π steht für die Multiplikation mehrerer Faktoren. Du multiplizierst schrittweise; die Reihenfolge spielt keine Rolle.",ex:"3 × 4 × 5 = 60",example:"3 × 4 × 5",steps:["Multipliziere schrittweise.","3 × 4 = 12.","12 × 5 = 60."]},
    gen:(L)=>{let terms;if(L===3){const a=rnd(1,3);terms=[2*a,2*a+2,2*a+4];}else{const len={1:3,2:4,3:3,4:5}[L],start=rnd(2,{1:6,2:5,3:5,4:4}[L]);terms=Array.from({length:len},(_,i)=>start+i);}
      const ans=terms.reduce((x,y)=>x*y,1);return{prompt:terms.join(' × '),answer:ans,hints:["Schrittweise multiplizieren, Reihenfolge egal.","Erst die ersten beiden, das Ergebnis mit dem nächsten."],explain:`${terms.join(' × ')} = ${fmt(ans)}.`};}},
  func:{name:"Funktionen", teaser:"f(x) auswerten",
    tut:{concept:"Eine Funktion f ordnet jedem Eingabewert x genau einen Ausgabewert zu. Um f an einer Stelle auszuwerten, setzt du die Zahl überall für x ein und rechnest aus.",ex:"f(x)=3x+2 → f(4)=14",example:"f(x) = 3x + 2,  f(4) = ?",steps:["Setze 4 für x ein: 3 × 4 + 2.","3 × 4 = 12.","12 + 2 = 14."]},
    gen:(L)=>{if(L<=2){const a=rnd(2,L===1?5:9),b=(L===2&&Math.random()<.4)?-rnd(1,9):rnd(1,9),x=rnd(2,L===1?6:9),y=a*x+b,bs=b<0?`− ${-b}`:`+ ${b}`;
        return{text:true,prompt:`f(x) = ${a}x ${bs},&nbsp;&nbsp; f(${x}) = ?`,answer:y,hints:["Setze den Zahlenwert überall für x ein.",`Erst ${a} × ${x}, dann ${bs.replace('−','minus').replace('+','plus')}.`],explain:`f(${x}) = ${a}·${x} ${bs} = ${y}.`};}
      const a=rnd(1,3),b=rnd(1,4)*(Math.random()<.3?-1:1),c=rnd(0,6),x=L===4?rnd(-3,4):rnd(1,4),y=a*x*x+b*x+c,bs=b<0?`− ${-b}`:`+ ${b}`;
      return{text:true,prompt:`f(x) = ${a}x² ${bs}x + ${c},&nbsp;&nbsp; f(${x}) = ?`,answer:y,hints:["Setze x ein; achte beim Quadrieren aufs Vorzeichen.","Punkt vor Strich: erst das x², dann die Multiplikationen, dann addieren."],explain:`f(${x}) = ${a}·(${x})² ${bs}·(${x}) + ${c} = ${y}.`};}},
  dreisatz:{name:"Dreisatz", teaser:"Proportionales Schließen",
    tut:{concept:"Beim Dreisatz schließt du von einer Anzahl auf eine andere. Gerader (proportionaler) Dreisatz: mehr → mehr – du rechnest erst auf 1 Einheit herunter und dann hoch. Umgekehrter Dreisatz: mehr → weniger (z. B. mehr Arbeiter, weniger Zeit).",ex:"3 Hefte kosten 6 €. 5 Hefte → 10 €",example:"3 Hefte kosten 6 €.   5 Hefte = ?",steps:["Auf 1 herunter: 6 € ÷ 3 = 2 € pro Heft.","Auf 5 hoch: 5 × 2 €.","= 10 €."]},
    gen:(L)=>{
      const inverse=(L===4)||(L===3&&Math.random()<0.5);
      if(inverse){const who=pick(["Arbeiter","Pumpen","Bagger","Maschinen"]),unit=pick(["Tagen","Stunden","Minuten"]);
        const a=rnd(2,9);let b;do{b=rnd(2,9);}while(b===a);const k=rnd(2,{3:4,4:6}[L]||4),d=b*k,ans=a*k;
        return{text:true,prompt:`${a} ${who} schaffen eine Arbeit in ${d} ${unit}. Wie lange brauchen ${b} ${who} (in ${unit})?`,answer:ans,
          hints:["Umgekehrter Dreisatz: mehr Helfer → weniger Zeit. Bestimme zuerst die Gesamtarbeit.",`Gesamtarbeit = ${a} × ${d} = ${a*d}; das durch ${b} Helfer teilen.`],
          explain:`${a} × ${d} = ${a*d} (Helfer·${unit}); ${a*d} ÷ ${b} = ${ans} ${unit}.`};}
      const cfg={1:[2,6,2,4,2,6],2:[2,9,2,6,2,9],3:[2,12,2,8,2,12]}[L]||[2,9,2,6,2,9];
      const u=rnd(cfg[0],cfg[1]),a=rnd(cfg[2],cfg[3]);let b;do{b=rnd(cfg[4],cfg[5]);}while(b===a);
      const given=a*u,ans=b*u;
      const C=[
        {q:`${a} Hefte kosten ${fmt(given)} €. Was kosten ${b} Hefte (in €)?`,unit:"€"},
        {q:`${a} kg Äpfel kosten ${fmt(given)} €. Was kosten ${b} kg (in €)?`,unit:"€"},
        {q:`Ein Auto fährt mit ${a} Litern ${fmt(given)} km weit. Wie weit kommt es mit ${b} Litern (in km)?`,unit:"km"},
        {q:`${a} gleiche Maschinen schaffen ${fmt(given)} Teile pro Stunde. Wie viele schaffen ${b} Maschinen (Teile)?`,unit:"Teile"},
        {q:`${a} Pakete wiegen zusammen ${fmt(given)} kg. Wie viel wiegen ${b} Pakete (in kg)?`,unit:"kg"}
      ];
      const c=pick(C);
      return{text:true,prompt:c.q,answer:ans,
        hints:["Gerader Dreisatz: erst auf 1 Einheit herunterrechnen, dann auf die gesuchte Anzahl hoch.",`${fmt(given)} ÷ ${a} = ${fmt(u)} je Einheit; davon ${b}-mal.`],
        explain:`${fmt(given)} ÷ ${a} = ${fmt(u)}; ${b} × ${fmt(u)} = ${fmt(ans)} ${c.unit}.`};}},
  geometrie:{name:"Geometrie", teaser:"Umfang, Kreis, Volumen, Pythagoras",
    tut:{concept:"Hier berechnest du Umfang, Kreis- und Körpergrößen und nutzt den Satz des Pythagoras. Bei Kreisen und Zylindern bleibt π als Faktor stehen – gefragt ist dann nur die Zahl vor π.",ex:"Katheten 3 und 4 → Hypotenuse 5",example:"Rechtwinkliges Dreieck mit Katheten 3 und 4 — Hypotenuse?",steps:["Satz des Pythagoras: a² + b² = c².","3² + 4² = 9 + 16 = 25.","c = √25 = 5."]},
    gen:(L)=>{
      const tri=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15],[7,24,25],[20,21,29]];
      const types={1:["urect","usquare"],2:["urect","usquare","circU","circA","pyth"],3:["usquare","circA","volBox","volCube","pyth"],4:["circA","circU","volBox","volCube","volCyl","pyth","pythLeg"]}[L];
      const t=pick(types);
      if(t==="urect"){const l=rnd(3,15),w=rnd(2,12);return{text:true,prompt:`Umfang eines Rechtecks mit Länge ${l} und Breite ${w}?`,answer:2*(l+w),hints:["Umfang = einmal rund um die Figur.","Umfang = 2 × (Länge + Breite)."],explain:`2 × (${l} + ${w}) = ${2*(l+w)}.`};}
      if(t==="usquare"){const sq=rnd(3,20);return{text:true,prompt:`Umfang eines Quadrats mit Seitenlänge ${sq}?`,answer:4*sq,hints:["Vier gleich lange Seiten.","Umfang = 4 × Seite."],explain:`4 × ${sq} = ${4*sq}.`};}

      if(t==="volCube"){const sq=rnd(2,9);return{text:true,prompt:`Volumen eines Würfels mit Kantenlänge ${sq}?`,answer:sq*sq*sq,hints:["Volumen = Kante³.","Kante × Kante × Kante."],explain:`${sq}³ = ${sq*sq*sq}.`};}
      if(t==="volCyl"){const r=rnd(2,8),h=rnd(2,10);return{text:true,prompt:`Volumen eines Zylinders mit Radius ${r} und Höhe ${h} — als Vielfaches von π (nur die Zahl vor π)?`,answer:r*r*h,hints:["Volumen = π · r² · h.","Gesucht ist r² · h."],explain:`V = π·${r}²·${h} = ${r*r*h}π → Antwort ${r*r*h}.`};}
      if(t==="pyth"){const x=pick(tri);return{text:true,prompt:`Rechtwinkliges Dreieck mit Katheten ${x[0]} und ${x[1]}. Wie lang ist die Hypotenuse?`,answer:x[2],hints:["Satz des Pythagoras: a² + b² = c².","Erst a² + b² rechnen, dann die Wurzel ziehen."],explain:`${x[0]}² + ${x[1]}² = ${x[0]*x[0]} + ${x[1]*x[1]} = ${x[2]*x[2]}; √${x[2]*x[2]} = ${x[2]}.`};}
      const x=pick(tri);return{text:true,prompt:`Rechtwinkliges Dreieck mit Hypotenuse ${x[2]} und einer Kathete ${x[0]}. Wie lang ist die andere Kathete?`,answer:x[1],hints:["Pythagoras umgestellt: b² = c² − a².","Erst c² − a², dann die Wurzel."],explain:`${x[2]}² − ${x[0]}² = ${x[2]*x[2]} − ${x[0]*x[0]} = ${x[1]*x[1]}; √${x[1]*x[1]} = ${x[1]}.`};}},
  trig:{name:"Trigonometrie", teaser:"Sinus, Kosinus, Tangens",

    gen:(L)=>{
      const tri=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];

        return{text:true,prompt:`Rechtwinkliges Dreieck: Gegenkathete ${x[0]}, Ankathete ${x[1]}, Hypotenuse ${x[2]}. ${fn}(α) = ?  (als Bruch; α liegt der Gegenkathete gegenüber)`,answer:num/den,disp:fracStr(num,den),answerType:"fraction",
          hints:["SOH-CAH-TOA: sin = Gegenkathete/Hypotenuse, cos = Ankathete/Hypotenuse, tan = Gegenkathete/Ankathete.",`Setze die passenden Seiten ein: ${fn} = ${num}/${den}.`],
          explain:`${fn}(α) = ${num}/${den} = ${fracStr(num,den)}.`};};
      const specials=[["sin","30°",0.5],["cos","60°",0.5],["tan","45°",1],["sin","90°",1],["cos","0°",1],["sin","0°",0],["cos","90°",0],["tan","0°",0]];
      const specialQ=()=>{const sp=pick(specials);return{text:true,prompt:`Berechne ${sp[0]}(${sp[1]}).`,answer:sp[2],hints:["Merke die Werte der besonderen Winkel.","sin 30° = 0,5 · cos 60° = 0,5 · tan 45° = 1 · sin 90° = 1 · cos 0° = 1."],explain:`${sp[0]}(${sp[1]}) = ${fmt(sp[2])}.`};};
      const sideQ=()=>{const m=pick(["30","60","45"]);
        if(m==="45"){const a=rnd(3,12);return{text:true,prompt:`Rechtwinkliges Dreieck mit einem 45°-Winkel. Eine Kathete ist ${a}. Wie lang ist die andere Kathete?`,answer:a,hints:["Bei 45° sind beide Katheten gleich lang.","tan 45° = Gegenkathete/Ankathete = 1."],explain:`Bei 45° sind beide Katheten gleich → ${a}.`};}
        const h=rnd(2,9)*2;
        if(m==="30")return{text:true,prompt:`Rechtwinkliges Dreieck: Hypotenuse ${h}, Winkel 30°. Wie lang ist die Gegenkathete des 30°-Winkels?`,answer:h/2,hints:["Gegenkathete = Hypotenuse × sin(Winkel).","sin 30° = 0,5 → die Hälfte der Hypotenuse."],explain:`${h} × sin 30° = ${h} × 0,5 = ${fmt(h/2)}.`};
        return{text:true,prompt:`Rechtwinkliges Dreieck: Hypotenuse ${h}, Winkel 60°. Wie lang ist die Ankathete des 60°-Winkels?`,answer:h/2,hints:["Ankathete = Hypotenuse × cos(Winkel).","cos 60° = 0,5 → die Hälfte der Hypotenuse."],explain:`${h} × cos 60° = ${h} × 0,5 = ${fmt(h/2)}.`};};
      const angleQ=()=>{const set=[["sin","0,5",30],["cos","0,5",60],["tan","1",45],["sin","1",90],["cos","0",90]];const sp=pick(set);
        return{text:true,prompt:`Für welchen Winkel α (in Grad, 0–90) gilt ${sp[0]}(α) = ${sp[1]}?`,answer:sp[2],hints:["Gehe die besonderen Winkel durch.","sin 30°=0,5 · cos 60°=0,5 · tan 45°=1 · sin 90°=1."],explain:`${sp[0]}(${sp[2]}°) = ${sp[1]} → α = ${sp[2]}°.`};};
      if(L===1)return specialQ();
      if(L===2)return Math.random()<0.5?ratioQ():specialQ();
      if(L===3)return pick([ratioQ,sideQ,specialQ])();
      return pick([ratioQ,sideQ,angleQ,specialQ])();}},
};

  Blumen:['Rose','Tulpe','Nelke','Lilie','Veilchen','Narzisse','Margerite','Aster'],
  Körperteile:['Arm','Bein','Hand','Fuß','Schulter','Knie','Ellbogen','Ferse']
};
const CAT_NAMES=Object.keys(CATS);
function pairKey(a,b){return [a,b].sort().join(' · ');}
function genOberbegriff(){
  const cat=pick(CAT_NAMES), ws=shuffle(CATS[cat].slice());
  const others=shuffle(CAT_NAMES.filter(c=>c!==cat)).slice(0,4);
  const opts=shuffle([cat,...others]);
  return {q:`Welcher Oberbegriff passt zu <b>${ws[0]}</b> und <b>${ws[1]}</b>?`,o:opts,c:opts.indexOf(cat),
    h:`Was sind ${ws[0]} und ${ws[1]} beide?`,h2:'Suche die Kategorie, zu der beide gehören.',
    e:`${ws[0]} und ${ws[1]} sind beides Beispiele für die Kategorie ${cat}.`};
}
function genPassende(){
  const cat=pick(CAT_NAMES), ws=shuffle(CATS[cat].slice()), w1=ws[0], w2=ws[1];
  const others=shuffle(CAT_NAMES.filter(c=>c!==cat)).slice(0,4).map(c=>pick(CATS[c]));
  const shown=shuffle([w1,w2,...others]);
  const correct=pairKey(w1,w2), set=new Set([correct]);
  let g=0; while(set.size<5 && g++<80){const a=pick(shown),b=pick(shown);if(a!==b)set.add(pairKey(a,b));}
  const opts=shuffle([...set]).slice(0,5);
  if(!opts.includes(correct))opts[opts.length-1]=correct;
  return {q:`Sechs Begriffe: <b>${shown.join(', ')}</b>.<br>Welche zwei gehören zusammen?`,o:opts,c:opts.indexOf(correct),
    h:'Welche zwei stammen aus derselben Kategorie?',h2:'Die übrigen Begriffe gehören zu ganz verschiedenen Bereichen.',
    e:`${w1} und ${w2} gehören beide zur Kategorie ${cat}; die anderen Begriffe stammen aus unterschiedlichen Bereichen.`};
}

const SERIES_POOLS={
  1:['arith','double','geo3'],
  2:['incdiff','decdiff','square','squarePlus1','halve','double'],
  3:['seconddiff','fib','primes','times2plus1','twosub'],
  4:['combovary','altops','cubes','doubleprimes','plusprimes','pronic','triangular','times3plus1','fib','times2plus1','twosub'],
  5:['combovary','altops','twosub','doubleprimes','plusprimes','seconddiff','times3plus1','cubes']
};
function seriesBuild(L){
  const lvl=clamp(Math.round(L)||1,1,5), pool=SERIES_POOLS[lvl]||SERIES_POOLS[4];
  for(let tries=0;tries<10;tries++){
    let b=null; try{ b=SERIES_PATTERNS[pick(pool)](); }catch(e){ b=null; }
    if(b&&Array.isArray(b.seq)&&b.seq.length>b.show&&b.seq.every(n=>Number.isInteger(n)&&n>=0)){
      return {prompt:`${b.seq.slice(0,b.show).join(' , ')} , ?`,answer:b.seq[b.show],
        hints:["Untersuche die Differenzen oder Verhältnisse benachbarter Zahlen.","Sind sie konstant, wachsend, steckt ein Faktor dahinter – oder sind zwei Reihen verschachtelt?"],explain:b.explain};
    }
  }
  const a=rnd(1,9),d=rnd(2,6),seq=[];for(let i=0;i<6;i++)seq.push(a+i*d);       // sicherer Fallback: konstante Differenz
  return {prompt:`${seq.slice(0,5).join(' , ')} , ?`,answer:seq[5],hints:["Untersuche die Differenzen benachbarter Zahlen."],explain:`Konstante Differenz +${d}. Daher folgt ${seq[4]} + ${d} = ${seq[5]}.`};
}

========================================================= */
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
function mod7(x){return ((x%7)+7)%7;}
function genWochentage(L){
  const D=rnd(0,6), Dn=DAYS[D]; let q,ans,exp;
  const baseHints=["Ganze Wochen (7 Tage) ändern den Wochentag nicht – nur der Rest zählt.","Rechne mit Zahlen: Montag = 0, Dienstag = 1, … Sonntag = 6, dann „modulo 7“ (Überlauf abziehen)."];
  if(L===1){const n=rnd(1,6);
    if(Math.random()<0.6){ans=D+n;q=`Heute ist ${Dn}. Welcher Tag ist in ${n} Tagen?`;exp=`${Dn} + ${n} Tage = ${DAYS[mod7(ans)]}.`;}
    else{ans=D-n;q=`Heute ist ${Dn}. Welcher Tag war vor ${n} Tagen?`;exp=`${Dn} − ${n} Tage = ${DAYS[mod7(ans)]}.`;}
  } else if(L===2){const n=rnd(2,13);
    if(Math.random()<0.5){ans=D-n;q=`In ${n} Tagen ist ${Dn}. Welcher Tag ist heute?`;exp=`Heute + ${n} = ${Dn} → heute = ${DAYS[mod7(ans)]}.`;}
    else{ans=D+n;q=`Vor ${n} Tagen war ${Dn}. Welcher Tag ist heute?`;exp=`Heute − ${n} = ${Dn} → heute = ${DAYS[mod7(ans)]}.`;}
  } else if(L===3){const w=rnd(1,4),n=rnd(1,6);
    if(Math.random()<0.5){ans=D+n;q=`Vor ${w} Wochen und ${n} Tagen war ${Dn}. Welcher Tag ist heute?`;exp=`${w} Wochen ändern den Wochentag nicht. Heute = ${Dn} + ${n} Tage = ${DAYS[mod7(ans)]}.`;}
    else{ans=D-n;q=`In ${w} Wochen und ${n} Tagen ist ${Dn}. Welcher Tag ist heute?`;exp=`Die ${w} Wochen zählen nicht. Heute = ${Dn} − ${n} Tage = ${DAYS[mod7(ans)]}.`;}
  } else {const a=rnd(2,6),b=rnd(2,6),w=rnd(1,3);
    if(Math.random()<0.5){ans=D-a-b;q=`In ${a} Tagen ist ${Dn}. Welcher Tag war vor ${w} Wochen und ${b} Tagen?`;exp=`Heute = ${Dn} − ${a}. Gesucht = heute − ${b} (die ${w} Wochen zählen nicht) = ${DAYS[mod7(ans)]}.`;}
    else{ans=D+a+b;q=`Vor ${a} Tagen war ${Dn}. Welcher Tag ist in ${w} Wochen und ${b} Tagen?`;exp=`Heute = ${Dn} + ${a}. Gesucht = heute + ${b} (die ${w} Wochen zählen nicht) = ${DAYS[mod7(ans)]}.`;}
  }
  return {render:'choice',q,opts:DAYS.slice(),c:mod7(ans),hints:baseHints,explain:exp};
}

function ensureCfaProfile(){const d=Store.data; if(!d.cfaProfile||typeof d.cfaProfile!=='object')d.cfaProfile={attempts:0,correct:0,errorRate:0,topics:{},weakTopics:[],reviewQueue:[],lastPracticed:null};
  const c=d.cfaProfile; if(!c.topics)c.topics={}; if(!Array.isArray(c.weakTopics))c.weakTopics=[]; if(!Array.isArray(c.reviewQueue))c.reviewQueue=[]; return c;}
function updateCfaProfile(catKey,ok){
  const c=ensureCfaProfile();
  c.attempts++; if(ok)c.correct++; c.errorRate=Math.round((1-c.correct/c.attempts)*100)/100; c.lastPracticed=Date.now();
  const t=c.topics[catKey]||(c.topics[catKey]={attempts:0,correct:0}); t.attempts++; if(ok)t.correct++;
  c.weakTopics=Object.keys(c.topics).filter(k=>{const x=c.topics[k];return x.attempts>=3 && (1-x.correct/x.attempts)>=0.4;})
    .sort((a,b)=>(1-c.topics[b].correct/c.topics[b].attempts)-(1-c.topics[a].correct/c.topics[a].attempts));
  if(ok){const i=c.reviewQueue.findIndex(r=>r.cat===catKey); if(i>=0)c.reviewQueue.splice(i,1);}
  else{const ex=c.reviewQueue.find(r=>r.cat===catKey); if(ex){ex.tries=(ex.tries||0)+1;ex.dueAt=Date.now();} else c.reviewQueue.push({cat:catKey,dueAt:Date.now(),tries:1,addedAt:Date.now()}); if(c.reviewQueue.length>30)c.reviewQueue=c.reviewQueue.slice(c.reviewQueue.length-30);}
  Store.persist();
}

const GMAT_TYPE={ps:'problem_solving',ds:'data_sufficiency',cr:'critical_reasoning'};
function gmatItemMeta(item){                                     // Fallbacks für Items ohne neue Metadaten
  const bank=(item&&(item.bank||item.cat))||'ps';               // topic/bank → ps
  const topic=(item&&(item.subtopic||item.topic))||bank;        // Subtopic/Topic bevorzugt, sonst bank (ps/ds/cr)
  const type=(item&&(item.type||item.gmatType))||GMAT_TYPE[bank]||'problem_solving';  // Fragestil bevorzugt, sonst Bank-Typ
  let diff=item&&(item.difficulty!=null?item.difficulty:item.diff);
  diff=(typeof diff==='number'&&isFinite(diff))?diff:2;         // Frage-Difficulty, sonst Session, sonst 2
  return {bank,topic,type,difficulty:diff};
}
function ensureGmatProfile(){
  const d=Store.data;
  if(!d.gmatProfile||typeof d.gmatProfile!=='object')
    d.gmatProfile={attempts:0,correct:0,errorRate:0,avgTimeMs:0,lastPracticed:null,
      topicStats:{},currentDifficulty:2,weakTopics:[],masteredTopics:[],reviewQueue:[]};
  const g=d.gmatProfile;                                        // fehlende Felder defensiv nachziehen
  if(typeof g.attempts!=='number')g.attempts=0;
  if(typeof g.correct!=='number')g.correct=0;
  if(typeof g.errorRate!=='number')g.errorRate=0;
  if(typeof g.avgTimeMs!=='number')g.avgTimeMs=0;
  if(typeof g.currentDifficulty!=='number'||!isFinite(g.currentDifficulty))g.currentDifficulty=2;
  if(!g.topicStats||typeof g.topicStats!=='object')g.topicStats={};
  if(!Array.isArray(g.weakTopics))g.weakTopics=[];
  if(!Array.isArray(g.masteredTopics))g.masteredTopics=[];
  if(!Array.isArray(g.reviewQueue))g.reviewQueue=[];
  return g;
}
function gmatTopicErr(t){return t&&t.attempts?1-t.correct/t.attempts:0;}
function gmatRecomputeTopicLists(g){                            // schwach: ≥5 Versuche & Fehlerquote ≥40 %
  const keys=Object.keys(g.topicStats);                        // gemeistert: ≥8 Versuche & Fehlerquote ≤15 %
  g.weakTopics=keys.filter(k=>{const t=g.topicStats[k];return t.attempts>=5&&gmatTopicErr(t)>=0.4;})
    .sort((a,b)=>gmatTopicErr(g.topicStats[b])-gmatTopicErr(g.topicStats[a]));
  g.masteredTopics=keys.filter(k=>{const t=g.topicStats[k];return t.attempts>=8&&gmatTopicErr(t)<=0.15;})
    .sort((a,b)=>gmatTopicErr(g.topicStats[a])-gmatTopicErr(g.topicStats[b]));
}
function gmatEnqueueReview(g,meta){                             // dedup pro Thema+Typ (wie cfaProfile pro cat)
  const ex=g.reviewQueue.find(r=>r.topic===meta.topic&&r.type===meta.type);
  if(ex){ex.tries=(ex.tries||0)+1;ex.dueAt=Date.now();}
  else g.reviewQueue.push({topic:meta.topic,type:meta.type,bank:meta.bank,difficulty:meta.difficulty,
    addedAt:Date.now(),dueAt:Date.now(),tries:1});
  if(g.reviewQueue.length>30)g.reviewQueue=g.reviewQueue.slice(g.reviewQueue.length-30);  // Kappung auf 30
}
function gmatDequeueReview(g,meta){
  const i=g.reviewQueue.findIndex(r=>r.topic===meta.topic&&r.type===meta.type);
  if(i>=0)g.reviewQueue.splice(i,1);
}
function updateGmatProfile(item,isCorrect,elapsedMs){
  const g=ensureGmatProfile(),meta=gmatItemMeta(item);
  const ms=(typeof elapsedMs==='number'&&isFinite(elapsedMs)&&elapsedMs>=0)?elapsedMs:0;
  // Gesamt: attempts zählt jede Antwort (sonst wäre errorRate stets 0); correct nur bei richtig.
  const prev=g.attempts;
  g.attempts++; if(isCorrect)g.correct++;
  g.errorRate=Math.round((1-g.correct/g.attempts)*100)/100;
  g.avgTimeMs=Math.round((g.avgTimeMs*prev+ms)/g.attempts);      // laufender Mittelwert über alle Versuche
  g.lastPracticed=Date.now();
  // Pro Thema (aktuell topic = bank: ps/ds/cr)
  const t=g.topicStats[meta.topic]||(g.topicStats[meta.topic]={attempts:0,correct:0,errorRate:0,avgTimeMs:0,type:meta.type,lastPracticed:null});
  const tprev=t.attempts;
  t.attempts++; if(isCorrect)t.correct++;
  t.errorRate=Math.round((1-t.correct/t.attempts)*100)/100;
  t.avgTimeMs=Math.round((t.avgTimeMs*tprev+ms)/t.attempts);
  t.type=meta.type; t.lastPracticed=Date.now();
  // Grobe adaptive Schwierigkeit (Treppe, asymmetrisch; wird gepflegt, steuert noch keine Auswahl)
  g.currentDifficulty=Math.round(clamp(g.currentDifficulty+(isCorrect?0.34:-0.5),1,5)*100)/100;  // GMAT-Skala 1–5
  // Abgeleitete Listen + Review-Queue
  gmatRecomputeTopicLists(g);
  if(isCorrect)gmatDequeueReview(g,meta); else gmatEnqueueReview(g,meta);
  Store.persist();
  return g;
}

function plain(x){return (Math.round(x*100)/100).toLocaleString('de-DE');}
function kmh(x){return plain(x)+' km/h';}
function pctt(x){return plain(x)+' %';}
function hrs(x){return plain(x)+' h';}
function days(x){return plain(x)+' Tage';}
function mc(correct,distractors,fmt){
  fmt=fmt||plain;
  const vals=[correct];
  const add=v=>{ if(v==null||!isFinite(v))return; v=Math.round(v*100)/100; if(!vals.some(u=>Math.abs(u-v)<1e-6))vals.push(v); };
  (distractors||[]).forEach(add);
  let mag=Math.max(1,Math.round(Math.abs(correct)*0.1)),k=1,guard=0;
  while(vals.length<5 && guard++<300){ add(correct+mag*k); if(vals.length<5)add(correct-mag*k); k++; if(k>6){mag++;k=1;} }
  const sh=shuffle(vals.slice(0,5));
  return {o:sh.map(fmt), c:sh.findIndex(v=>Math.abs(v-correct)<1e-6)};
}
function mcStr(correct,distractors){
  const vals=[correct]; (distractors||[]).forEach(d=>{ if(d&&!vals.includes(d))vals.push(d); });
  let guard=0; while(vals.length<5 && guard++<60){ const t=rnd(1,9)+' : '+rnd(2,9); if(!vals.includes(t))vals.push(t); }
  const sh=shuffle(vals.slice(0,5)); return {o:sh, c:sh.indexOf(correct)};
}

function gmatItem(id){const g=BANKS[id];return g.gen?normItem(g.type,pick(g.gen)()):normItem(g.type,pick(g.bank));}
/* ---- GMAT-PS Difficulty-Auswahl (additiv; NUR PS – DS/CR/Daily unverändert) ----
   Zieht PS-Fragen passend zum aktuellen GMAT-Level (gmatProfile.currentDifficulty, 1–5)
   statt rein zufällig. Regel: bevorzugt das exakte Level; zu wenige → ±1 Level; immer
   noch zu wenige → ganzer Pool. currentDifficulty bleibt ein Skalar 1–5 und wird
   unverändert per Antwort fortgeschrieben (max. kleiner Schritt pro Antwort). */
let _gmatPsMeta=null;
function gmatPsMeta(){                                   // GEN_PS einmalig indexieren, dann cachen
  if(_gmatPsMeta)return _gmatPsMeta;
  _gmatPsMeta=GEN_PS.map(fn=>{ let d=2,tp='ps',ty='problem_solving';
    try{ const it=fn(); if(typeof it.difficulty==='number'&&isFinite(it.difficulty))d=it.difficulty; if(it.subtopic||it.topic)tp=it.subtopic||it.topic; if(it.type)ty=it.type; }catch(e){}
    return {fn,difficulty:clamp(Math.round(d),1,5),topic:tp,type:ty}; });
  return _gmatPsMeta;
}
function gmatTargetLevel(topic){                          // Ziel-Level für die PS-Auswahl
  const g=Store.data&&Store.data.gmatProfile;
  if(g){
    if(topic&&g.topicStats&&g.topicStats[topic]&&typeof g.topicStats[topic].level==='number')  // optionaler Pro-Topic-Hook
      return clamp(Math.round(g.topicStats[topic].level),1,5);
    if(typeof g.currentDifficulty==='number'&&isFinite(g.currentDifficulty))
      return clamp(Math.round(g.currentDifficulty),1,5);
  }
  return 2;                                               // kein Profil → Standard-Level 2
}
function pickGmatPsGenerators(n,level,topic){
  const meta=gmatPsMeta();
  const byTopic=topic?meta.filter(m=>m.topic===topic):meta;         // optional auf Subtopic einschränken
  const base=byTopic.length>=n?byTopic:meta;                        // Subtopic zu klein → ganzer PS-Pool
  let pool=base.filter(m=>m.difficulty===level);                    // 1) exakt das Level
  if(pool.length<n)pool=base.filter(m=>Math.abs(m.difficulty-level)<=1);  // 2) ±1 Level
  if(pool.length<n)pool=base.slice();                              // 3) ganzer Pool (Fallback)
  const sh=shuffle(pool.slice()),out=[];
  for(let i=0;i<n;i++)out.push(sh[i%sh.length].fn);
  return out;
}
/* ---- Difficulty-BAND für die Standalone-PS-Session (additiv; NUR buildGmatList/PS) ----
   Ziel: Ziel-Difficulty wird bevorzugt gezogen, aber ±1 wird bewusst eingemischt, sodass
   z. B. Level 3 → überwiegend 2–4 und Level 5 → überwiegend 4–5 liefert (statt hartem
   Ein-Stufen-Schnitt). Tiered-Fallback bleibt: ±1-Band; zu klein → ±2; zu klein → ganzer
   Pool. Gewichte innerhalb des Pools sind nie 0, currentDifficulty driftet über 1–5 →
   dauerhaft bleibt keine Frage unerreichbar. gmatPsMeta/gmatTargetLevel unverändert. */
function pickGmatPsBand(n,level,topic){
  const meta=gmatPsMeta();
  const byTopic=topic?meta.filter(m=>m.topic===topic):meta;        // optional auf Subtopic einschränken
  const base=byTopic.length>=n?byTopic:meta;                       // Subtopic zu klein → ganzer PS-Pool
  let pool=base.filter(m=>Math.abs(m.difficulty-level)<=1);        // 1) ±1-Band (bevorzugt)
  if(pool.length<n)pool=base.filter(m=>Math.abs(m.difficulty-level)<=2);  // 2) ±2-Band
  if(pool.length<n)pool=base.slice();                              // 3) ganzer Pool (Fallback)
  const wOf=m=>{const d=Math.abs(m.difficulty-level);return d===0?3:d===1?1:d===2?0.35:0.12;}; // Ziel bevorzugt, nie 0
  const out=[]; let bag=pool.slice();
  for(let i=0;i<n;i++){
    if(!bag.length)bag=pool.slice();                               // nachfüllen, falls Pool < n (Wiederholung nur dann)
    const tot=bag.reduce((s,m)=>s+wOf(m),0); let r=Math.random()*tot,idx=0;
    for(let k=0;k<bag.length;k++){ r-=wOf(bag[k]); if(r<=0){idx=k;break;} }
    out.push(bag[idx].fn); bag.splice(idx,1);                      // ohne Zurücklegen innerhalb einer Runde → Varianz
  }
  return out;
}
function buildGmatList(id){const g=BANKS[id];
  if(g.bank) return shuffle(g.bank.slice()).slice(0,ROUND).map(it=>normItem(g.type,it));   // CR: unverändert
  if(id==='ps'){                                                    // PS: difficulty-Band (Ziel bevorzugt, ±1 eingemischt)
    const fns=pickGmatPsBand(ROUND,gmatTargetLevel());
    return fns.map(fn=>normItem(g.type,fn()));
  }
  const tpls=shuffle(g.gen.slice());const list=[];for(let i=0;i<ROUND;i++) list.push(normItem(g.type,tpls[i%tpls.length]()));return list;}  // DS u. a. gen-Bänke: unverändert

let PROFILE={};
function loadProfile(){ PROFILE=Store.data.profile; migrateKonzWm(); }      // Referenz auf den Blob – Mutationen sind sofort im Store
function saveProfile(){ Store.persist(); }
function getProf(key){return PROFILE[key]||{attempts:0,correct:0,lastDiff:2,curDiff:2,errorRate:0,avgTime:0};}
function curLevel(key){return clamp(Math.round((PROFILE[key]?.curDiff)??2),1,4);}
function updateAdaptiveProfile(result){
  const {key,ok,difficulty,timeMs}=result; if(!key)return;
  const p=PROFILE[key]||{attempts:0,correct:0,lastDiff:difficulty||2,curDiff:difficulty||2,errorRate:0,avgTime:0};
  p.attempts++; if(ok)p.correct++;
  p.errorRate=+(1-p.correct/p.attempts).toFixed(3);
  if(difficulty!=null)p.lastDiff=difficulty;
  let d=(p.curDiff!=null?p.curDiff:(difficulty||2));
  d += ok ? 0.30 : -0.45;                 // sanft hoch, etwas schneller runter
  p.curDiff=+clamp(d,1,4).toFixed(3);

}

function groupLevel(group){
