  return clamp(Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),1,4);
}
function weightedPick(weighted){const tot=weighted.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;for(const x of weighted){r-=x.w;if(r<=0)return x.c;}return weighted[weighted.length-1].c;}
/* ---- GMAT-PS im Tagestraining: adaptive Subtopic-/Difficulty-/Review-Auswahl (additiv) ----
   NUR PS. DS/CR laufen weiter über gmatItem(). Greift nur, wenn 'ps' als Subkategorie
   aktiviert und ausgewählt ist (Subkategorie-Auswahl bleibt strikt maßgeblich). */
function pickWeightedGmatSubtopic(g){
  const topics=[...new Set(gmatPsMeta().map(m=>m.topic))];
  const weak=new Set(Array.isArray(g&&g.weakTopics)?g.weakTopics:[]), mastered=new Set(Array.isArray(g&&g.masteredTopics)?g.masteredTopics:[]);
  const weighted=topics.map(t=>({c:t, w: weak.has(t)?3 : (mastered.has(t)?0.4 : 1)}));  // schwach häufiger, gemeistert seltener (nie 0)
  return weightedPick(weighted);
}
function pickGmatPsGeneratorFor(topic,type,level){          // Review: Generator zu Topic + Typ, nahe am Level
  const meta=gmatPsMeta();
  let pool=meta.filter(m=>m.topic===topic&&m.type===type);
  if(!pool.length)pool=meta.filter(m=>m.topic===topic);
  if(!pool.length)return null;
  let band=pool.filter(m=>m.difficulty===level);
  if(!band.length)band=pool.filter(m=>Math.abs(m.difficulty-level)<=1);
  if(!band.length)band=pool;
  return pick(band).fn;
}
function dailyGmatPsItem(){
  const g=Store.data&&Store.data.gmatProfile, level=gmatTargetLevel();
  // 1) FÄLLIGE Review-Einträge (nur PS-fähige Themen) bevorzugt einstreuen – aber nicht dominant (~50 %).
  //    Richtige Antwort auf ein Review-Item entfernt den Eintrag via updateGmatProfile→gmatDequeueReview.
  if(g&&Array.isArray(g.reviewQueue)&&g.reviewQueue.length){
    const now=Date.now(), psTopics=new Set(gmatPsMeta().map(m=>m.topic));
    const due=g.reviewQueue.filter(r=>(r.dueAt==null||r.dueAt<=now)&&(psTopics.has(r.topic)||r.bank==='ps'));
    if(due.length&&Math.random()<0.5){
      const r=pick(due), fn=pickGmatPsGeneratorFor(r.topic,r.type,level);
      if(fn){ const it=normItem('choice',fn()); it.review=true; return it; }
    }
  }
  // 2) Subtopic nach Performance (schwach häufiger, gemeistert seltener), Difficulty nach currentDifficulty
  const fns=pickGmatPsGenerators(1,level,pickWeightedGmatSubtopic(g));
  return normItem('choice',fns[0]());
}
function makeDailyItem(cat,L,dailyDuration){
  let it;
  if(cat.combo){ it=makeComboItem({daily:true, dailyDuration:dailyDuration}); it.cat=cat.key; it.group=cat.group; it.diff=it.memLevel; return it; }
  if(cat.span){const dir=Math.random()<.5?'fwd':'bwd';it=makeSpan(clamp(2+L,3,8),dir);}
  else if(cat.bank==='ps'){it=dailyGmatPsItem();}          // PS: adaptiv (Subtopic/Difficulty/Review)
  else if(cat.bank){it=gmatItem(cat.bank);}                // DS/CR: unverändert
  else {it={render:'input',...cat.gen(L)};}
  it.cat=cat.key; it.group=cat.group; it.diff=L; return it;
}
function generateDailyAdaptivePool(duration){
  const count={5:12,10:24,15:36}[duration]||12;
  const st=dailySubState();
  let cats=allCategories().filter(c=>st.enabled.has(c.key)); if(!cats.length)cats=allCategories();
  const mp=Store.data.mathProfile, cs=(mp&&mp.categoryStats)||null;
  const enabledKeys=new Set(cats.map(c=>c.key));
  const lvlFor=c=>{const m=cs&&c.key.indexOf('math:')===0?cs[c.key]:null;return m?levelToGenLevel(m.level):curLevel(c.key);};
  const items=[];
  // 1) Fällige Mathe-Wiederholungen bevorzugen (nur aktivierte Kategorien)
  if(mp&&Array.isArray(mp.reviewQueue)&&mp.reviewQueue.length){
    const now=Date.now(),seen=new Set(),due=[];
    for(const r of mp.reviewQueue){ if(r.dueAt<=now && enabledKeys.has(r.cat) && !seen.has(r.cat)){seen.add(r.cat);due.push(r.cat);} }
    const maxReview=Math.min(due.length, Math.max(1,Math.round(count*0.2)));
    for(let i=0;i<maxReview;i++){const c=cats.find(x=>x.key===due[i]);if(c){const it=makeDailyItem(c,lvlFor(c),duration);it.review=true;items.push(it);}}
  }
  // 2) Gewichtete Auffüllung (Mathe via theta/rd/Fokus, sonst altes Profil)
  const weighted=cats.map(c=>{
    const m=cs&&c.key.indexOf('math:')===0?cs[c.key]:null; let w;
    if(m){ const focusW=(100-m.theta)/100, uncW=m.rd/100; w=0.6+1.8*focusW+0.6*uncW; if(m.mastery==='mastered')w*=0.5; if(mp.focus&&mp.focus.indexOf(c.key)>=0)w*=1.3; }
    else { const p=getProf(c.key); const tried=p.attempts>0; const err=tried?p.errorRate:0.4; w=1+1.8*err+(tried?0:0.3); }
    return {c,w:Math.max(0.15,w)};
  });
  for(let i=items.length;i<count;i++){const c=weightedPick(weighted);items.push(makeDailyItem(c,lvlFor(c),duration));}
  return shuffle(items);
}

/* ========= MATHE-DIAGNOSE: Cluster, θ/RD-Scoring, Eingangstest (V1) ========= */
let placement=null;
const CLUSTER_ORDER=['c_grund','c_anteil','c_potenz','c_geo','c_folgen'];
const CLUSTER_LABEL={c_grund:'Grundrechnen',c_anteil:'Brüche, Prozent & Verhältnis',c_potenz:'Potenzen, Wurzeln & Log',c_geo:'Geometrie & Trigonometrie',c_folgen:'Folgen, Funktionen & Kombinatorik'};
const CLUSTERS={c_grund:['math:chain','math:mulS','math:mulB'],c_anteil:['math:frac','math:pct','math:dreisatz'],c_potenz:['math:pow','math:sqrt','math:log'],c_geo:['math:area','math:geometrie','math:trig'],c_folgen:['math:sum','math:prod','math:factorial','math:func']};
const THETA_S=25,THETA_KMAX=12,THETA_KMIN=3,THETA_RD0=100,THETA_RDMIN=25,THETA_RD_DECAY=0.92;
function thetaExpected(theta,d){return 1/(1+Math.pow(10,(d-theta)/THETA_S));}
function thetaUpdate(theta,rd,d,r){const E=thetaExpected(theta,d);const K=clamp(THETA_KMAX*(rd/THETA_RD0),THETA_KMIN,THETA_KMAX);return {theta:clamp(theta+K*(r-E),0,100),rd:Math.max(THETA_RDMIN,rd*THETA_RD_DECAY)};}
function thetaToLevel(theta){return clamp(1+Math.floor(theta/8.4),1,12);}
function levelToGenLevel(level){return clamp(Math.ceil(level/3),1,4);}
function catName(key){const a=String(key).split(':');return a[0]==='math'?(MATH[a[1]]?MATH[a[1]].name:a[1]):key;}
function ensureMathProfile(){if(!Store.data.mathProfile||typeof Store.data.mathProfile!=='object')Store.data.mathProfile={};}
function mathStatFor(catKey){const mp=Store.data.mathProfile; if(!mp||!mp.categoryStats)return null;
  if(mp.categoryStats[catKey])return mp.categoryStats[catKey];
  const id=String(catKey).split(':')[1];                                   // Lazy-Seed für gültige, aber (noch) nicht diagnostizierte Mathe-Subtypen
  if(String(catKey).slice(0,5)!=='math:'||!MATH[id])return null;
  const theta=50, lvl=thetaToLevel(theta);                                 // neutraler Start; adaptiert sich wie andere Subtypen
  mp.categoryStats[catKey]={cluster:null,theta,rd:90,seed:theta,level:lvl,attempts:0,correct:0,errorRate:0,avgTimeMs:0,lastPracticed:null,mastery:'none',missedTypes:{},nextRec:'practice',window:[]};
  return mp.categoryStats[catKey];}
function mathReviewAdd(catKey,type){
  const mp=Store.data.mathProfile;if(!mp)return; mp.reviewQueue=mp.reviewQueue||[];
  const ex=mp.reviewQueue.find(r=>r.cat===catKey&&(r.type||null)===(type||null));
  if(ex){ex.tries=(ex.tries||0)+1;ex.dueAt=Date.now();}
  else mp.reviewQueue.push({cat:catKey,type:type||null,dueAt:Date.now(),tries:1,addedAt:Date.now()});
  if(mp.reviewQueue.length>30)mp.reviewQueue=mp.reviewQueue.slice(mp.reviewQueue.length-30);
}
function mathReviewResolve(catKey){
  const mp=Store.data.mathProfile;if(!mp||!Array.isArray(mp.reviewQueue))return;
  const i=mp.reviewQueue.findIndex(r=>r.cat===catKey);if(i>=0)mp.reviewQueue.splice(i,1);
}
function updateMathProfile(catKey,ok,genDiff,timeMs,q){
  const st=mathStatFor(catKey); if(!st)return;
  if(!state.mathStartLevel)state.mathStartLevel={};
  if(state.mathStartLevel[catKey]==null)state.mathStartLevel[catKey]=st.level;
  const d=(genDiff||2)*25-12;
  const u=thetaUpdate(st.theta,st.rd,d,ok?1:0);
  st.theta=Math.round(u.theta*10)/10; st.rd=Math.round(u.rd*10)/10;
  st.attempts=(st.attempts||0)+1; st.correct=(st.correct||0)+(ok?1:0);
  st.errorRate=Math.round((1-st.correct/st.attempts)*100)/100;
  st.avgTimeMs=Math.round(((st.avgTimeMs||0)*(st.attempts-1)+(timeMs||0))/st.attempts);
  st.window=st.window||[]; st.window.push(ok?1:0); if(st.window.length>10)st.window.shift();
  st.lastPracticed=Date.now();
  if(!ok && q && q.type){st.missedTypes=st.missedTypes||{};st.missedTypes[q.type]=(st.missedTypes[q.type]||0)+1;}
  const win=st.window, acc=win.length?win.reduce((a,b)=>a+b,0)/win.length:0, raw=thetaToLevel(st.theta), startLv=state.mathStartLevel[catKey];
  let lv=st.level;
  if(raw>st.level && win.length>=5 && acc>=0.8) lv=st.level+1;
  else if(raw<st.level && win.length>=5 && acc<=0.45) lv=st.level-1;
  lv=clamp(lv,startLv-1,startLv+1); st.level=clamp(lv,1,12);
  if(win.length>=8 && acc>=0.9 && st.rd<=35) st.mastery='mastered';
  else if(st.mastery==='mastered' && acc<0.7) st.mastery='learning';
  else if(!st.mastery||st.mastery==='none') st.mastery='learning';
  const maxMissed=st.missedTypes?Math.max(0,...Object.values(st.missedTypes)):0;
  if((st.errorRate>=0.5 && st.attempts>=4) || maxMissed>=3) st.nextRec='lesson';
  else if(win.length>=4 && acc>=0.9) st.nextRec='maintain';
  else st.nextRec='practice';
  if(ok) mathReviewResolve(catKey); else mathReviewAdd(catKey,q&&q.type);
  Store.persist();
}
function recomputeMathAggregates(){
  const mp=Store.data.mathProfile; if(!mp||!mp.categoryStats)return;
  const cs=mp.categoryStats, entries=Object.entries(cs); if(!entries.length)return;
  const thetas=entries.map(e=>e[1].theta), ov=thetas.reduce((a,b)=>a+b,0)/thetas.length;
  mp.overall={theta:Math.round(ov*10)/10,level:thetaToLevel(ov),updatedAt:Date.now()};
  const byTheta=[...entries].sort((a,b)=>b[1].theta-a[1].theta||a[1].rd-b[1].rd);
  mp.strongest=byTheta.slice(0,3).map(e=>e[0]);
  mp.weakest=byTheta.slice(-3).reverse().map(e=>e[0]);
  mp.focus=[...entries].sort((a,b)=>((100-b[1].theta)+0.3*b[1].rd)-((100-a[1].theta)+0.3*a[1].rd)).slice(0,3).map(e=>e[0]);
  mp.clusterStats=mp.clusterStats||{};
  for(const cl of CLUSTER_ORDER){const ms=CLUSTERS[cl].map(k=>cs[k]).filter(Boolean);if(ms.length){const t=ms.reduce((a,b)=>a+b.theta,0)/ms.length,r=ms.reduce((a,b)=>a+b.rd,0)/ms.length;mp.clusterStats[cl]={theta:Math.round(t*10)/10,rd:Math.round(r*10)/10,level:thetaToLevel(t)};}}
}

  const entries=Object.entries(categoryStats);
  const byTheta=[...entries].sort((a,b)=>b[1].theta-a[1].theta||a[1].rd-b[1].rd);
  mp.version=1;mp.overall={theta:Math.round(overall*10)/10,level:thetaToLevel(overall),updatedAt:Date.now()};
  mp.clusterStats=clusterStats;mp.categoryStats=categoryStats;
  mp.strongest=byTheta.slice(0,3).map(e=>e[0]);
  mp.weakest=byTheta.slice(-3).reverse().map(e=>e[0]);
  mp.focus=[...entries].sort((a,b)=>((100-b[1].theta)+0.3*b[1].rd)-((100-a[1].theta)+0.3*a[1].rd)).slice(0,3).map(e=>e[0]);
  mp.reviewQueue=mp.reviewQueue||[];
  mp.trainingPlan={generatedAt:Date.now(),weekFocus:mp.focus.slice(0,2),ratios:{focus:0.45,review:0.20,maintain:0.20,stretch:0.15}};
  pt.status='done';pt.completedAt=Date.now();placement=null;state={};Store.persist();placementResult();
}

/* ---- Stufe 2: Gedankentipp im Aufgabenfeedback --------------------------------
   Ein einziger Hook (showFeedback). Deterministische Regeln, kein Math.random:
   - Falsche Antwort: Tipp IMMER, wenn ein passender Kandidat existiert.
   - Richtige Antwort: nur fast/estimate/avoid-Tipps; angezeigt beim 1. und dann
     jedem 3. passenden Treffer der Session – ODER sofort bei praezisem Muster
     (z. B. ×25, 99×…, Klammer-Gleichung). Max. 1 Tipp pro Aufgabe; nie dieselbe
     ID direkt hintereinander; innerhalb der Session bevorzugt ungezeigte Tipps.
   - Session-Zustand haengt am SESSION_TOKEN (kein Profil, kein localStorage). */
let mtFb={token:-1,shown:[],eligibleCorrect:0};
function mtFbSync(){ const tok=(state&&state.token)!=null?state.token:-1; if(mtFb.token!==tok)mtFb={token:tok,shown:[],eligibleCorrect:0}; }
function mtBaseKey(q){ if(!q)return null; const c=String(q.cat||'');
  if(c.indexOf('math:')===0)return c.slice(5);
  if(c==='logic:series')return 'series';
  if(c==='ps'||((!c)&&state&&state.key==='ps'&&q.topic!=null))return 'ps';   // GMAT-PS: Daily (cat) oder Bank-Session (key)
  return null; }                                                              // CFA/DS/CR/WM/Deutsch/Elektro/übrige Logik: kein Tipp
function _selectMentalTip(q,wasCorrect,recentIds){
  const k=mtBaseKey(q); if(!k)return null;
  const cands=tipsFor(k); if(!cands.length)return null;
  recentIds=Array.isArray(recentIds)?recentIds:[];
  const P=String(q.prompt||q.q||''),T=String(q.type||''),X=String(q.explain||'');
  const by=id=>cands.find(t=>t.id===id)||null;
  let precise=null;
  if(k==='mulB'||k==='mulS'){
    if(/(^|[^0-9])(98|99|101|102)\s*×/.test(P)||/×\s*(98|99|101|102)([^0-9]|$)/.test(P))precise=by('mul_nahe_100');
    else if(/×\s*(125|25)([^0-9]|$)/.test(P)||/(^|[^0-9])(125|25)\s*×/.test(P))precise=by('mul_5_25_125');
  } else if(k==='pct'){
    if(/Prozentpunkt/i.test(P))precise=by('pct_punkte');
    else if(/dann|danach|anschließend|zuerst/i.test(P))precise=by('pct_faktor');
    else if(/(^|\D)(25|12,5|15|10|5)\s?%/.test(P))precise=by('pct_bausteine');
  } else if(k==='frac'){
    if(/[×·]/.test(P))precise=by('frac_kuerzen_mult');
    else if(/[+−]/.test(P))precise=by('frac_kgv');
  } else if(k==='equations'){ precise=(T==='paren')?by('eq_klammer'):by('eq_umkehr'); }
  else if(k==='linsys'){
    if(T==='given_x'||T==='given_y'||T==='subst')precise=by('ls_einsetzen');
    else if(T==='add_sub')precise=by('ls_summe_diff');
    else if(T.indexOf('elim')===0)precise=by('ls_addition');
  } else if(k==='series'){ precise=/Teilfolgen|verschachtelt|abwechselnd|Position/i.test(X)?by('serie_teilfolgen'):by('serie_differenzen'); }
  else if(k==='dreisatz'){ precise=/Arbeiter|Maschinen|weniger Zeit|indirekt/i.test(P)?by('ds_proportional'):by('ds_einheit'); }
  else if(k==='sqrt'){ if(/√/.test(P))precise=by('sqrt_nachbarn'); }
  else if(k==='pow'){ if(/⁻/.test(P))precise=by('pow_gesetze'); else if(/²/.test(P))precise=by('pow_quadrate'); }
  else if(k==='geometrie'||k==='area'){
    if(/Hypotenuse|Kathete/i.test(P))precise=by('geo_345');
    else if(/Dreieck/i.test(P))precise=by('geo_dreieck');
  } else if(k==='ps'){ if(q.topic==='fractions')precise=by('frac_kreuz'); }
  let pool=wasCorrect?cands.filter(t=>t.mode==='fast'||t.mode==='estimate'||t.mode==='avoid'):cands.slice();
  if(!pool.length)return null;
  if(precise&&pool.indexOf(precise)<0)precise=null;                            // praeziser Treffer muss im erlaubten Pool liegen
  const ordered=precise?[precise,...pool.filter(t=>t!==precise)]:pool;
  const last=recentIds.length?recentIds[recentIds.length-1]:null;
  const tip=ordered.find(t=>recentIds.indexOf(t.id)<0)||ordered.find(t=>t.id!==last)||null;
  if(!tip)return null;
  return {tip,precise:!!(precise&&tip===precise)};
}
function selectMentalTip(question,wasCorrect,recentTipIds){ const r=_selectMentalTip(question,wasCorrect,recentTipIds); return r?r.tip:null; }
function maybeAppendMentalTip(ok){
  try{
    mtFbSync();

    if(ok){ mtFb.eligibleCorrect++; if(!r.precise&&mtFb.eligibleCorrect%3!==1)return; }

      <button class="fbtip-more" type="button">Beispiel anzeigen ›</button>

}

/* ================= COACH (lokal & offline; nur Analyse vorhandener Profile) ================= */
const COACH_DAY=86400000;
function coachGmatName(t){const m={ps:'Problem Solving',ds:'Data Sufficiency',cr:'Critical Reasoning',arith:'Arithmetik',fractions:'Brüche',algebra:'Algebra',word:'Textaufgaben',ratework:'Raten & Arbeit',mixture:'Mischung',numprop:'Zahleneigenschaften',powroot:'Potenzen & Wurzeln',stats:'Statistik',geo:'Geometrie',percent:'Prozent'};return m[t]||t;}
function coachCfaName(t){return String(t).replace(/^cfa:/,'').replace(/[_:]/g,' ');}
function coachWmName(k){const m={'wm:span:fwd':'Zahlenspanne vorwärts','wm:span:bwd':'Zahlenspanne rückwärts','wm:nback':'N-Back','wm:bdpq':'b/d/p/q','wm:days':'Wochentage','wm:combo':'Kombi-Memory'};return m[k]||k.replace('wm:','WM ');}
function coachCandidates(){
  const now=Date.now(), out=[]; const D=Store.data||{};
  const add=o=>{ o.score=60*(o.err||0)+24*Math.min(o.due||0,3)+4*Math.min(o.idle||0,15)+(o.weak?18:0)+(o.mastered?-45:6); out.push(o); };
  try{ const mp=D.mathProfile; if(mp&&mp.categoryStats){ const rq=Array.isArray(mp.reviewQueue)?mp.reviewQueue:[]; const weakest=new Set(Array.isArray(mp.weakest)?mp.weakest:[]);
    for(const key of Object.keys(mp.categoryStats)){ const st=mp.categoryStats[key]||{}; const att=st.attempts||0;
      const due=rq.filter(r=>r.cat===key&&(r.dueAt==null||r.dueAt<=now)).length;
      if(att===0&&due===0&&!weakest.has(key))continue; const id=String(key).split(':')[1];
      add({area:'Mathe',key,name:catName(key),err:typeof st.errorRate==='number'?st.errorRate:0,due,idle:st.lastPracticed?Math.floor((now-st.lastPracticed)/COACH_DAY):0,mastered:st.mastery==='mastered',weak:weakest.has(key),start:(typeof MATH==='object'&&MATH[id])?()=>trainGen('math',id,'D'):null}); } } }catch(e){}
  try{ const g=D.gmatProfile; if(g&&(g.attempts||0)>0){ const rq=Array.isArray(g.reviewQueue)?g.reviewQueue:[]; const ts=g.topicStats||{}; const weak=new Set(Array.isArray(g.weakTopics)?g.weakTopics:[]),mast=new Set(Array.isArray(g.masteredTopics)?g.masteredTopics:[]);
    for(const t of new Set([...Object.keys(ts),...weak])){ const st=ts[t]||{attempts:0,correct:0}; const att=st.attempts||0;
      const due=rq.filter(r=>r.topic===t&&(r.dueAt==null||r.dueAt<=now)).length;
      if(att===0&&due===0&&!weak.has(t))continue;
      add({area:'GMAT',gtopic:t,name:'GMAT '+coachGmatName(t),err:att?(1-(st.correct||0)/att):0,due,idle:st.lastPracticed?Math.floor((now-st.lastPracticed)/COACH_DAY):0,mastered:mast.has(t),weak:weak.has(t),start:()=>trainBank(t==='ds'?'ds':t==='cr'?'cr':'ps')}); } } }catch(e){}
  try{ const c=D.cfaProfile; if(c&&(c.attempts||0)>0){ const rq=Array.isArray(c.reviewQueue)?c.reviewQueue:[]; const weak=new Set(Array.isArray(c.weakTopics)?c.weakTopics:[]); const tp=c.topics||{};
    for(const t of new Set([...Object.keys(tp),...weak])){ const st=tp[t]||{attempts:0,correct:0}; const att=st.attempts||0;
      const due=rq.filter(r=>r.cat===t&&(r.dueAt==null||r.dueAt<=now)).length;
      if(att===0&&due===0&&!weak.has(t))continue;
      add({area:'CFA',name:'CFA '+coachCfaName(t),err:att?(1-(st.correct||0)/att):0,due,idle:0,mastered:false,weak:weak.has(t),start:(typeof cfaHub==='function'?cfaHub:null)}); } } }catch(e){}
  try{ const cp=D.wmComboProfile; if(cp&&(cp.attempts||0)>=3){ const mAcc=cp.mathAccuracy||0,memAcc=cp.memoryAccuracy||0; const worst=Math.min(mAcc||1,memAcc||1);
    add({area:'Kombi-Memory',name:'Kombi-Memory',err:1-worst,due:0,idle:cp.lastPracticed?Math.floor((now-cp.lastPracticed)/COACH_DAY):0,mastered:false,weak:(worst<0.65),start:(typeof wmHub==='function'?wmHub:null),mathWeaker:(mAcc>0&&mAcc<memAcc-0.08)}); } }catch(e){}
  try{ if(typeof PROFILE==='object'&&PROFILE){ for(const k of Object.keys(PROFILE)){ if(k.indexOf('wm:')!==0)continue; const p=PROFILE[k]||{}; if((p.attempts||0)<3)continue;
    add({area:'WM',name:coachWmName(k),err:p.errorRate||0,due:0,idle:0,mastered:false,weak:(p.errorRate||0)>=0.4,start:(typeof wmHub==='function'?wmHub:null)}); } } }catch(e){}
  out.sort((a,b)=>b.score-a.score); return out;
}
function coachDueReviewable(){ const now=Date.now(); let n=0;
  try{ const mp=Store.data.mathProfile; if(mp&&Array.isArray(mp.reviewQueue))n+=mp.reviewQueue.filter(r=>r.dueAt==null||r.dueAt<=now).length; }catch(e){}
  try{ const g=Store.data.gmatProfile; if(g&&Array.isArray(g.reviewQueue))n+=g.reviewQueue.filter(r=>(r.dueAt==null||r.dueAt<=now)&&(!r.bank||r.bank==='ps')).length; }catch(e){}
  return n; }
/* Coach-Strategie: deterministische Tipp-Auswahl fuer den Top-Kandidaten.
   Nur Mathe-Subtypen, logic:series (defensiv, falls kuenftig Kandidat) und GMAT-PS mit
   eindeutiger Mathe-Zuordnung (Topic fractions). CFA/WM/Kombi/DS/CR/unbekannt → null.
   Bevorzugung: fast → avoid → estimate → erster Kandidat (MENTAL_TIPS-Reihenfolge). */
function coachMentalTip(cand){
  try{
    if(!cand)return null;
    let k=null;
    if(cand.area==='Mathe'&&cand.key)k=String(cand.key).split(':').pop();
    else if(cand.area==='GMAT'&&cand.gtopic==='fractions')k='ps';
    else if(cand.key==='logic:series'||cand.key==='series')k='series';
    if(!k)return null;
    const all=tipsFor(k); if(!all.length)return null;
    const HOME={pct:'Prozent',frac:'Brüche',chain:'Grundrechnen',mulS:'Multiplikation',mulB:'Multiplikation',
      sqrt:'Potenzen/Wurzeln',pow:'Potenzen/Wurzeln',log:'Potenzen/Wurzeln',equations:'Gleichungen',
      linsys:'Gleichungssysteme',dreisatz:'Dreisatz',geometrie:'Geometrie',area:'Geometrie',
      series:'Folgen/Logik',sum:'Folgen/Logik',ps:'Interview-Mental-Math'};
    const prim=HOME[k]?all.filter(t=>t.category===HOME[k]):[];
    const cands=prim.length?prim:all;                                  // Heimatkategorie bevorzugen, sonst alle passenden
    let tip=null;
    if(k==='ps')tip=cands.find(t=>t.id==='frac_kreuz')||all.find(t=>t.id==='frac_kreuz')||null;
    if(!tip)for(const m of ['fast','avoid','estimate']){ tip=cands.find(t=>t.mode===m)||null; if(tip)break; }
    return tip||cands[0]||null;
  }catch(e){ return null; }
}
function coachModel(){
  const cands=coachCandidates(); const streak=Streak.effectiveCurrent(), done=Streak.doneToday();
  let dueTotal=0; cands.forEach(c=>dueTotal+=(c.due||0)); const dueReviewable=coachDueReviewable();
  let dueNonRegen=0; const nowT=Date.now();
  try{ const c=Store.data.cfaProfile; if(c&&Array.isArray(c.reviewQueue))dueNonRegen+=c.reviewQueue.filter(r=>r.dueAt==null||r.dueAt<=nowT).length; }catch(e){}
  try{ const g=Store.data.gmatProfile; if(g&&Array.isArray(g.reviewQueue))dueNonRegen+=g.reviewQueue.filter(r=>(r.dueAt==null||r.dueAt<=nowT)&&r.bank&&r.bank!=='ps').length; }catch(e){}
  const weakCount=cands.filter(c=>c.weak||(c.err||0)>=0.4).length;
  let recMin=10; if(dueTotal>=6||weakCount>=3)recMin=15; else if(dueTotal<=1&&weakCount<=1)recMin=5;
  let mode='normal'; if(!cands.length)mode=(streak>0)?'light':'new';
  const names=[],seenN=new Set(); for(const c of cands){ if(names.length>=3)break; if(seenN.has(c.name))continue; seenN.add(c.name); names.push(c.name.length>22?c.name.slice(0,21)+'…':c.name); }
  const top=cands[0]||null; const reasons=[];
  if(dueTotal>0)reasons.push(`${dueTotal} fällige Wiederholung${dueTotal===1?'':'en'}`);
  if(top&&(top.err||0)>=0.4)reasons.push(`hohe Fehlerquote bei ${top.name}`);
  if(reasons.length<2&&top&&top.idle>=7)reasons.push(`${top.name} länger nicht geübt`);
  if(reasons.length<2&&top&&top.weak)reasons.push(`${top.name}: Baustelle, aber verbesserbar`);
  if(reasons.length<2&&!done&&streak>0)reasons.push('Streak halten');
  if(reasons.length<2&&top&&top.mastered)reasons.push(`${top.name} läuft rund – kurze Auffrischung`);
  let note=''; const combo=cands.find(c=>c.area==='Kombi-Memory'); const masteredMath=cands.find(c=>c.area==='Mathe'&&c.mastered);
  if(combo&&combo.mathWeaker)note='Kombi-Memory: Die Mathe-Störung wirkt stärker als die Merklast.';
  else if(masteredMath)note=`Du bist bei ${masteredMath.name} stabiler geworden.`;
  else if(done&&streak>0)note='Heute schon erledigt – eine kurze Runde hält den Streak locker.';
  let tip=null; if(top){ const t=coachMentalTip(top); if(t)tip={id:t.id,title:t.title,line:t.summary}; }
  return {mode,recMin,streak,done,dueTotal,dueReviewable,dueNonRegen,names,top,reasons:reasons.slice(0,2),note,tip,topStart:(top&&top.start)||null};
}
function coachCardHTML(m){
  let main,focus='',btns='';
  if(m.mode==='new'){ main='Willkommen! Starte mit einer kurzen Einstufung oder einer 5-Minuten-Runde.'; focus='So findet die App dein Niveau.';
    btns=`<button class="btn" id="coach-einstufung">Kurze Einstufung starten</button><button class="btn ghost" id="coach-5">5-Minuten-Runde</button>`; }
  else if(m.mode==='light'){ main=`Heute empfohlen: ${m.recMin} Minuten Training.`; focus='Halte deinen Streak mit einer kurzen, gemischten Runde.';
    btns=`<button class="btn" id="coach-start">Empfohlenes Training starten</button><button class="btn ghost" id="coach-5">Kurze 5-Minuten-Runde</button>`; }
  else{ main=`Heute empfohlen: ${m.recMin} Minuten Training.`; focus=m.names.length?`Fokus: ${m.names.join(', ')}`:'Gemischte, adaptive Runde.';
    btns=`<button class="btn" id="coach-start">Empfohlenes Training starten</button>`;
    if(m.dueReviewable>0)btns+=`<button class="btn ghost" id="coach-review">Rechenfehler wiederholen (${m.dueReviewable})</button>`;
    else if(m.topStart)btns+=`<button class="btn ghost" id="coach-weak">Schwächstes Thema trainieren</button>`;
    btns+=`<button class="btn ghost" id="coach-5">Kurze 5-Minuten-Runde</button>`; }
  const reasons=m.reasons.length?`<div class="coach-reasons">${m.reasons.map(r=>`<span class="coach-reason">${r}</span>`).join('')}</div>`:'';
  const strat=(m.mode!=='new'&&m.tip)?`<div class="coach-strategy"><b>Strategie:</b> ${m.tip.line} <button class="coach-tipview" id="coach-tipview" type="button">Tipp ansehen ›</button></div>`:'';
  const note=m.note?`<div class="coach-note">${m.note}</div>`:'';
  const hint=(m.mode!=='new'&&m.dueNonRegen>0)?`<div class="coach-hint">Weitere Reviews (CFA/DS/CR) fließen ins Tagestraining ein.</div>`:'';
  return `<div class="card coach"><div class="coach-top"><span class="coach-tag">Coach</span><span class="coach-dur">${m.recMin} Min empfohlen</span></div>
    <div class="coach-main">${main}</div><div class="coach-focus">${focus}</div>${reasons}${strat}${note}<div class="coach-btns">${btns}</div>${hint}</div>`;
}
function wireCoach(m){ const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  on('coach-einstufung',()=>placementStart()); on('coach-5',()=>startDaily(5));
  on('coach-start',()=>{ if(m.dueReviewable>=3)startCoachReview(); else startDaily(m.recMin||10); });
  on('coach-review',()=>startCoachReview());
  on('coach-weak',()=>{ if(m.topStart)m.topStart(); else startDaily(m.recMin||10); });
  on('coach-tipview',()=>{ if(!m.tip)return; mtFilter={cat:'Alle',mode:'Alle'}; mtOpen=m.tip.id; mtBack='home'; mentalTipsScreen(); }); }
function startCoachReview(){
  const now=Date.now(), items=[]; const D=Store.data||{};
  try{ const mp=D.mathProfile; if(mp&&Array.isArray(mp.reviewQueue)){ for(const r of mp.reviewQueue){ if(items.length>=14)break; if(r.dueAt!=null&&r.dueAt>now)continue;
    const id=String(r.cat||'').split(':')[1]; const t=(typeof MATH==='object')&&MATH[id];
    if(t&&typeof t.gen==='function'){ try{ const st=mathStatFor(r.cat); const gl=st?levelToGenLevel(st.level):2; const q={render:'input',...t.gen(gl)}; q.cat=r.cat;q.group='math';q.diff=gl;q.review=true; items.push(q);}catch(e){} } } } }catch(e){}
  try{ const g=D.gmatProfile; if(g&&Array.isArray(g.reviewQueue)){ const level=(typeof gmatTargetLevel==='function')?gmatTargetLevel():2;
    for(const r of g.reviewQueue){ if(items.length>=16)break; if(r.dueAt!=null&&r.dueAt>now)continue; if(r.bank&&r.bank!=='ps')continue;
      try{ const fn=pickGmatPsGeneratorFor(r.topic,r.type,level); if(fn){ const it=normItem('choice',fn()); it.cat='ps';it.group='gmat';it.diff=level;it.review=true; items.push(it);} }catch(e){} } } }catch(e){}
  if(!items.length){ startDaily(5); return; }
  const list=shuffle(items).slice(0,Math.max(6,Math.min(items.length,15)));
  startSession({kind:'list',list,total:list.length,label:'Fehler-Wiederholung',key:'coach:review',restart:startCoachReview});
}

function runTutorial(cfg){
  state={kind:'tutorial',token:++SESSION_TOKEN}; const myToken=state.token; setHomeBtn(true); tag.textContent="einführung";
  const slides=['concept','walk']; if(cfg.practice)slides.push('practice'); slides.push('done');
  let idx=0;

    document.getElementById('bk').onclick=()=>idx>0?go(idx-1):cfg.backTo();}
  function renderSlide(){const s=slides[idx];if(s==='concept')slideConcept();else if(s==='walk')slideWalk();else if(s==='practice')slidePractice();else slideDone();}
  function slideConcept(){
    shell(`<div class="primer"><div class="pk">Worum geht's?</div><p>${cfg.concept}</p>${cfg.ex?`<div class="pk">Beispiel</div><p class="ex">${cfg.ex}</p>`:''}</div>

  function slideWalk(){

      const wb=document.getElementById('walkbtn');

      else {wb.innerHTML=`<button class="btn" id="nx" style="margin-top:14px">${cfg.practice?'Selbst probieren ›':'Verstanden ›'}</button>`;document.getElementById('nx').onclick=()=>go(idx+1);}}

  function finishRow(){document.getElementById('nextrow').innerHTML=`<button class="btn" id="nx" style="margin-top:16px">Weiter ›</button>`;document.getElementById('nx').onclick=()=>go(idx+1);}
  function slidePractice(){

    const q=cfg.practice.make();let inner;
    if(q.render==='input') inner=(q.text?`<div class="q-text">${q.prompt}</div>`:`<div class="q-math">${q.prompt}</div>`)+`<input class="num-input" id="ans" placeholder="?"><button class="btn" id="sub" style="margin-top:12px">Prüfen</button>`;
    else {const keys="ABCDEFG",stmts=q.stmts?`<span class="stmt">(1) ${q.stmts[0]}</span><span class="stmt">(2) ${q.stmts[1]}</span>`:"";
      inner=`<div class="q-text">${q.q}${stmts}</div><div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${keys[k]}</span><span>${o}</span></button>`).join("")}</div>`;}
    shell(`<div class="seclabel">Geführter Versuch — der Tipp ist schon da</div>${inner}
      <div class="tip-text" style="margin-top:14px"><b>Tipp:</b> ${qHints(q)[0]||''}</div><div class="feedback" id="fb"></div><div id="nextrow"></div>`);
    if(q.render==='input'){const inp=document.getElementById('ans');inp.setAttribute('inputmode',typeof q.answer==='string'?'text':'numeric');inp.focus();
      const chk=()=>{const raw=inp.value.trim();if(!raw)return;inp.disabled=true;const ok=typeof q.answer==='string'?norm(raw)===norm(q.answer):Math.abs(parseNum(raw)-q.answer)<1e-6;
        inp.style.borderColor=ok?'var(--good)':'var(--bad)';document.getElementById('sub').style.display='none';const fb=document.getElementById('fb');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=(ok?'Richtig.':`Korrekt ist ${dispAns(q)}.`)+`<div class="explain">${q.explain||''}</div>`;finishRow();};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')chk();});document.getElementById('sub').onclick=chk;}
    else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;document.querySelectorAll('.opt').forEach((x,xi)=>{x.disabled=true;if(xi===q.c)x.classList.add('correct');if(xi===k&&k!==q.c)x.classList.add('wrong');});
      const fb=document.getElementById('fb');fb.className='feedback '+(k===q.c?'good':'bad');fb.innerHTML=(k===q.c?'Richtig.':'Nicht ganz.')+`<div class="explain">${q.explain||''}</div>`;finishRow();});}
  function slideSpanPractice(q){
    shell(`<div class="seclabel">Geführter Versuch — der Tipp ist schon da</div>

    const stage=document.getElementById('stage');let i2=0;const alive=()=>myToken===SESSION_TOKEN&&document.body.contains(stage);
    function step(){if(!alive())return;if(i2<q.digits.length){stage.textContent=q.digits[i2];i2++;setTimeout(()=>{if(!alive())return;stage.textContent='';setTimeout(step,180);},720);}else rec();}
    function rec(){if(!alive())return;stage.textContent='?';stage.style.opacity=.3;document.getElementById('recall').hidden=false;const inp=document.getElementById('ans');inp.focus();
      const chk=()=>{const raw=inp.value.trim();if(!raw)return;inp.disabled=true;const ok=norm(raw)===norm(q.answer);inp.style.borderColor=ok?'var(--good)':'var(--bad)';document.getElementById('sub').style.display='none';

      inp.addEventListener('keydown',e=>{if(e.key==='Enter')chk();});document.getElementById('sub').onclick=chk;}

  function slideDone(){

function trainGen(group,id,level){
  const reg=regOf(group),t=reg[id],key=group+':'+id;
  if(level!=='D'&&level!=='A')level=clamp(Math.round(level)||2,1,4);   // Guard: Level außerhalb 1–4 (z. B. aus Altdaten) sicher kappen
  if(level==='D'){ const st=mathStatFor(key), gl=st?levelToGenLevel(st.level):2;
    startSession({kind:'agen',gen:t.gen,group,aLevel:gl,goodStreak:0,total:ROUND,label:t.name+' · Mein Niveau (L'+(st?st.level:'–')+')',key,restart:()=>trainGen(group,id,'D')}); return; }
  if(level==='A') startSession({kind:'agen',gen:t.gen,group,aLevel:2,goodStreak:0,total:ROUND,label:t.name+' · adaptiv',key,restart:()=>trainGen(group,id,'A')});
  else startSession({kind:'list',list:Array.from({length:ROUND},()=>{const q={render:'input',...t.gen(level)};q.cat=key;q.group=group;q.diff=level;return q;}),total:ROUND,label:t.name+' · L'+level,key,restart:()=>trainGen(group,id,level)});
}
function trainBank(id){const list=buildGmatList(id).map(o=>{o.cat=id;o.group='gmat';o.diff=2;return o;});

function startSpan(dir){startSession({kind:'span',spanDir:dir,spanLen:clamp(2+curLevel('wm:span'),3,8),maxSpan:0,total:ROUND,label:'Zahlenspanne '+(dir==='bwd'?'rückwärts':'vorwärts'),key:'wm:span:'+dir,restart:()=>startSpan(dir)});}
function startDaily(min){const list=generateDailyAdaptivePool(min);startSession({kind:'list',daily:true,duration:min,list,total:list.length,label:`Tagestraining · ${min}′`,key:'daily:'+min,restart:()=>startDaily(min)});}
function genBdpq(L){
  const len=({1:24,2:32,3:40,4:48})[clamp(Math.round(L||2),1,4)]||32;
  const letters=['b','d','p','q']; let str='';
  for(let i=0;i<len;i++)str+=pick(letters);
  const target=pick(letters);
  const count=(str.match(new RegExp(target,'g'))||[]).length;
  const block=`<div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:21px;letter-spacing:5px;line-height:2;word-break:break-all;margin-top:10px;color:var(--ink)">${str}</div>`;
  const hl=str.replace(new RegExp(target,'g'),`<b style="color:var(--accent)">${target}</b>`);
  return {render:'input',text:true,prompt:`Zähle, wie oft <b>${target}</b> vorkommt:${block}`,answer:count,
    hints:['Gehe die Reihe ruhig von links nach rechts durch.','Achte genau auf die Richtung – b/d und p/q sehen sich gespiegelt sehr ähnlich.'],
    explain:`„${target}“ kommt ${count}-mal vor:<div style="font-family:monospace;letter-spacing:4px;word-break:break-all;margin-top:6px">${hl}</div>`};
}
function startBdpq(){const L=clamp(curLevel('wm:bdpq'),1,4);

function makeSpan(len,dir){const digits=Array.from({length:len},()=>rnd(0,9));const expected=(dir==='bwd'?[...digits].reverse():digits).join('');

function startSession(cfg){state={i:0,correct:0,streak:0,t0:Date.now(),answered:false,list:[],areaLog:{},review:[],token:++SESSION_TOKEN,...cfg};renderQ();}

  });

function currentQuestion(){
  if(state.list[state.i])return state.list[state.i];
  let q;
  if(state.kind==='agen'){q={render:'input',...state.gen(state.aLevel)};q.cat=state.key;q.group=state.group;q.diff=state.aLevel;}
  else if(state.kind==='span'){q=makeSpan(state.spanLen,state.spanDir);q.cat='wm:span';q.group='wm';q.diff=clamp(state.spanLen-2,1,4);}

/* =========================================================
   KOMBI-MEMORY  (Working Memory · Merken -> Ablenkung -> Abruf)
   Neue WM-Unterkategorie ab v1.12.0. Selbst-adaptiv auf zwei Achsen:
   Memory Load (Anzahl gemerkter Elemente) und Interferenz Load

/* ---- Inhalts-Baenke ---- */
const COMBO_WORDS=["Apfel","Berg","Blume","Brot","Bruecke","Dach","Feder","Fluss","Garten","Hafen","Hand","Haus","Hund","Insel","Kaffee","Katze","Kerze","Koenig","Lampe","Loeffel","Maus","Meer","Mond","Nadel","Ofen","Pferd","Regen","Ring","Schuh","Segel","Sonne","Stern","Stuhl","Tisch","Turm","Uhr","Vogel","Wald","Wasser","Wolke"];
const COMBO_CODE_LETTERS="ABCDEFGHKLMNPRSTVWXYZ".split(''); // ohne leicht verwechselbare I,J,O,Q,U
/* ---- Drei unabhängige Achsen (je Stufe 1–3) ----
   Merklast   -> Anzahl + Komplexität der Elemente + ob Reihenfolge zählt
   Interferenz-> nur ANZAHL der Ablenkungs-Matheaufgaben
   Mathe      -> nur SCHWIERIGKEIT der Ablenkungsaufgaben (entkoppelt von Interferenz) */
const COMBO_MEM={
  1:{count:[2,3], contents:['words','numbers'],          order:()=>false},
  2:{count:[4,4], contents:['numbers','codes','words'],  order:()=>Math.random()<0.4},
  3:{count:[5,6], contents:['codes','mixed'],            order:()=>true}
};
const COMBO_INTF={1:[1,1], 2:[2,3], 3:[4,5]};              // Anzahl Ablenkungsaufgaben je Stufe
const COMBO_MEM_LABEL={1:'niedrig',2:'mittel',3:'hoch'};
const COMBO_INTF_LABEL={1:'niedrig',2:'mittel',3:'hoch'};
const COMBO_MATH_LABEL={1:'leicht',2:'mittel',3:'schwer'};
function comboModeLabel(m){return ({adaptive:'Adaptiv',words:'Woerter',numbers:'Zahlen',codes:'Codes',mixed:'Gemischt'})[m]||m;}
function comboContentNoun(mode){return mode==='words'?'Woerter':mode==='numbers'?'Zahlen':mode==='codes'?'Codes':'Elemente';}
function comboElNoun(t){return t==='word'?'Wort':t==='number'?'Zahl':'Code';}

function comboMakeElements(mode,count){
  count=clamp(count,1,8);
  const used=new Set(); const els=[];
  for(let i=0;i<count;i++){
    let t = mode==='mixed'?pick(['word','number','code']):({words:'word',numbers:'number',codes:'code'})[mode]||'word';
    let val,g=0;
    do{
      if(t==='word')val=pick(COMBO_WORDS);
      else if(t==='number')val=String(rnd(10,99));
      else val=pick(COMBO_CODE_LETTERS)+rnd(1,9);
    }while(used.has(t+':'+val.toUpperCase())&&++g<80);
    used.add(t+':'+val.toUpperCase());
    els.push({type:t,val:val});
  }
  return els;
}

/* ---- Interferenz-Mathe (kurz, im Kopf loesbar) ----
   num  -> Freitext-Eingabe (nie Brueche)
   mc   -> Multiple-Choice (Brueche NUR hier) */
const COMBO_FRAC_POOL=['1/2','1/3','2/3','1/4','3/4','1/6','5/6','2/5','3/5','1/5'];
const COMBO_INT_POOL=['2','3','4','5','6','8','9','10','12','15','16','20','24'];
function comboFracMC(){
  const templates=[
    ()=>{const t=pick([['1/4','1/4','1/2'],['1/2','1/4','3/4'],['1/3','1/3','2/3'],['1/6','1/3','1/2'],['2/5','1/5','3/5'],['1/2','1/3','5/6'],['1/6','1/6','1/3']]);
      return {q:t[0]+' + '+t[1]+' = ?',c:t[2],frac:true};},
    ()=>{const fr=pick([['1/2',1,2],['1/4',1,4],['3/4',3,4],['1/3',1,3],['2/3',2,3]]),base=pick([8,12,16,20,24]);
      if((base*fr[1])%fr[2]!==0)return null; return {q:fr[0]+' von '+base+' = ?',c:String(base*fr[1]/fr[2]),frac:false};},
    ()=>{const t=pick([['2/4','1/2'],['3/6','1/2'],['4/8','1/2'],['2/6','1/3'],['3/9','1/3'],['4/6','2/3'],['6/8','3/4'],['2/10','1/5']]);
      return {q:t[0]+' gekuerzt = ?',c:t[1],frac:true};}
  ];
  let r=null,g=0; while(!r&&g++<12)r=pick(templates)();
  if(!r)r={q:'1/2 + 1/4 = ?',c:'3/4',frac:true};
  const pool=r.frac?COMBO_FRAC_POOL:COMBO_INT_POOL;
  const opts=new Set([r.c]); let g2=0;
  while(opts.size<4&&g2++<60){const d=pick(pool); if(d!==r.c)opts.add(d);}
  const arr=shuffle([...opts]);
  return {kind:'mc',prompt:r.q,opts:arr,c:arr.indexOf(r.c)};
}
function comboNumMathQ(mathLevel){
  const L=clamp(mathLevel,1,3);
  const types=['add','sub','mulS'];                                    // leicht: Addition/Subtraktion, kleines Einmaleins
  if(L>=2)types.push('add2','mulB','pct','eqAdd','eqMul');             // mittel: größeres 1×1, Prozent leicht, einfache Gleichungen
  if(L>=3)types.push('mul2x1','add3','pctHard','eqMul2');              // schwer: mehrschrittig, 2-stellig
  const t=pick(types);
  const R=(kind,prompt,answer)=>({kind:kind,prompt:prompt,answer:answer,type:t});
  if(t==='add'){const a=rnd(4,L>=2?60:20),b=rnd(4,L>=2?60:20);return R('num',a+' + '+b,a+b);}
  if(t==='add2'){const a=rnd(20,90),b=rnd(15,70);return R('num',a+' + '+b,a+b);}
  if(t==='add3'){const a=rnd(20,60),b=rnd(15,50),c=rnd(10,Math.min(45,a+b));return R('num',a+' + '+b+' \u2212 '+c,a+b-c);}
  if(t==='sub'){const a=rnd(10,L>=2?90:30),b=rnd(2,a);return R('num',a+' \u2212 '+b,a-b);}
  if(t==='mulS'){const a=rnd(2,9),b=rnd(2,9);return R('num',a+' \u00d7 '+b,a*b);}
  if(t==='mulB'){const a=rnd(11,15),b=rnd(2,9);return R('num',a+' \u00d7 '+b,a*b);}
  if(t==='mul2x1'){const a=rnd(12,19),b=rnd(3,8);return R('num',a+' \u00d7 '+b,a*b);}
  if(t==='pct'){const p=pick([10,20,25,50]),base=pick([20,40,60,80,120,160,200]);return R('num',p+'% von '+base,base*p/100);}
  if(t==='pctHard'){const p=pick([15,30,35,40,60,75]),base=pick([40,60,80,120,160,180,240]);const v=base*p/100;if(!Number.isInteger(v))return comboNumMathQ(2);return R('num',p+'% von '+base,v);}
  if(t==='eqAdd'){const x=rnd(3,20),a=rnd(2,30);return R('num','x + '+a+' = '+(x+a)+'  \u00b7  x = ?',x);}
  if(t==='eqMul'){const x=rnd(2,9),a=rnd(2,9);return R('num',a+' \u00b7 x = '+(a*x)+'  \u00b7  x = ?',x);}
  if(t==='eqMul2'){const x=rnd(3,12),a=rnd(3,8),b=rnd(2,20);return R('num',a+'x + '+b+' = '+(a*x+b)+'  \u00b7  x = ?',x);}
  const a=rnd(5,20),b=rnd(5,20);return R('num',a+' + '+b,a+b);
}
/* ===== Ablenkungs-Aufgabentypen (additiv; kurz, iPhone-tauglich) =====
   Jede Aufgabe traegt Metadaten: distractionType, mathDifficulty (easy/medium/hard),
   expectedSteps (1-3), render (input/choice). Brueche IMMER als Choice. Kurze Erklaerung.
   comboNumMathQ/comboFracMC bleiben als Bausteine bzw. Fallback erhalten. */
const CMD={1:'easy',2:'medium',3:'hard'};
const CMINUS='\u2212', CTIMES='\u00d7', CDIV='\u00f7', CEUR='\u20ac', CDOT='\u00b7';
function cNum(dt,L,steps,prompt,answer,explain){
  return {kind:'num',render:'input',type:dt,distractionType:dt,mathDifficulty:CMD[L],
    expectedSteps:steps,prompt:prompt,answer:answer,explain:explain||''};
}
function cChoice(dt,L,steps,prompt,correct,distractors,explain){
  const opts=[correct]; for(const d of (distractors||[])){ if(opts.length>=4)break; if(d!=null&&opts.indexOf(d)<0)opts.push(d); }
  const arr=shuffle(opts);
  return {kind:'mc',render:'choice',type:dt,distractionType:dt,mathDifficulty:CMD[L],
    expectedSteps:steps,prompt:prompt,opts:arr,c:arr.indexOf(correct),explain:explain||''};
}
function cFrac(L){ const q=comboFracMC();                                  // {kind:'mc',prompt,opts,c} – Brueche stets Choice
  q.type='frac'; q.distractionType='frac'; q.render='choice'; q.mathDifficulty=CMD[L];
  q.expectedSteps=(L>=3?2:1); q.explain='Bruch: gemeinsamer Nenner bzw. kuerzen.'; return q; }
const COMBO_GEN={
  /* leicht (L1) */
  add:()=>{const a=rnd(4,20),b=rnd(4,20);return cNum('add',1,1,a+' + '+b,a+b,'Zehner und Einer addieren.');},
  sub:()=>{const a=rnd(10,30),b=rnd(2,a);return cNum('sub',1,1,a+' '+CMINUS+' '+b,a-b,'Vom groesseren Wert abziehen.');},
  mulS:()=>{const a=rnd(2,9),b=rnd(2,9);return cNum('mul',1,1,a+' '+CTIMES+' '+b,a*b,'Kleines Einmaleins.');},

const COMBO_TYPES={
  1:['add','sub','mulS','divEasy','pctEasy','eq1'],
  2:['chain','mulB','pctChange','discount','fracMC','eq2','pattern'],
  3:['chainHard','fracHard','pctRatio','word','estimate','compare','eqTrap','logic']
};
function comboMathQ(mathLevel){
  const L=clamp(Math.round(mathLevel)||2,1,3);
  const pool=COMBO_TYPES[L]||COMBO_TYPES[2], t=pick(pool);
  let q=null; try{ if(COMBO_GEN[t])q=COMBO_GEN[t](L); }catch(e){ q=null; }
  if(!q||q.answer==null&&!Array.isArray(q.opts)){ const n=comboNumMathQ(L); q=cNum(n.type||'num',L,1,n.prompt,n.answer,''); }  // Fallback: bestehende Logik
  return q;
}

/* ---- Profil: getrennte Level für Merklast / Interferenz / Mathe (1–3) ---- */
function ensureWmComboProfile(){
  const d=Store.data;
  let p=d.wmComboProfile;
  if(!p||typeof p!=='object'){ p=d.wmComboProfile={}; }
  const map5to3=v=> (v==null?null : (v<=2?1 : (v<=3?2 : 3)));   // Migration altes 1–5-Modell
  if(p.memoryLoadLevel==null)     p.memoryLoadLevel     = map5to3(p.currentMemoryLoad)      || 2;
  if(p.interferenceLevel==null)   p.interferenceLevel   = map5to3(p.currentInterferenceLoad)|| 2;
  if(p.mathDifficultyLevel==null) p.mathDifficultyLevel = map5to3(p.currentInterferenceLoad)|| 2;
  if(p.attempts==null)p.attempts=0;
  if(p.correctMemory==null)p.correctMemory=0;
  if(p.mathAttempts==null)p.mathAttempts=0;
  if(p.correctMath==null)p.correctMath=0;
  if(p.memoryAccuracy==null)p.memoryAccuracy=0;
  if(p.mathAccuracy==null)p.mathAccuracy=0;
  if(p.avgRecallTimeMs==null)p.avgRecallTimeMs=0;
  if(p.lastPracticed===undefined)p.lastPracticed=null;
  if(p.weakMode===undefined)p.weakMode=null;
  if(!Array.isArray(p.recentSessions))p.recentSessions=[];
  if(!p.modeStats)p.modeStats={};
  ['words','numbers','codes','mixed'].forEach(m=>{if(!p.modeStats[m])p.modeStats[m]={att:0,mem:0};});
  return p;
}
function updateWmComboProfile(result,item){
  const p=ensureWmComboProfile();
  p.attempts=(p.attempts||0)+1;
  if(result.memoryOk)p.correctMemory=(p.correctMemory||0)+1;
  p.mathAttempts=(p.mathAttempts||0)+(result.mathTotal||0);
  p.correctMath=(p.correctMath||0)+(result.mathCorrect||0);
  p.memoryAccuracy=+(p.correctMemory/p.attempts).toFixed(3);
  p.mathAccuracy=p.mathAttempts?+(p.correctMath/p.mathAttempts).toFixed(3):0;
  const rt=result.recallMs||0;
  p.avgRecallTimeMs=p.avgRecallTimeMs?Math.round(p.avgRecallTimeMs*0.7+rt*0.3):Math.round(rt);
  p.lastPracticed=Date.now();
  const cm=item.contentMode; if(cm&&p.modeStats[cm]){p.modeStats[cm].att++; if(result.memoryOk)p.modeStats[cm].mem++;}
  let worst=null,worstAcc=2;
  for(const m of ['words','numbers','codes','mixed']){const s=p.modeStats[m]; if(s&&s.att>=3){const a=s.mem/s.att; if(a<worstAcc){worstAcc=a;worst=m;}}}
  p.weakMode=worst;
  p.recentSessions.push({ts:Date.now(),mode:cm,memLevel:item.memLevel,intfLevel:item.intfLevel,mathLevel:item.mathLevel,memoryOk:!!result.memoryOk,mathCorrect:result.mathCorrect||0,mathTotal:result.mathTotal||0,recallMs:rt,daily:!!item.daily});
  if(p.recentSessions.length>20)p.recentSessions=p.recentSessions.slice(-20);
  Store.persist();
}
// Adaptive Regeln je Achse, max ±1 pro Session:
//  Memory gut / Mathe schlecht -> Mathe senken, Merklast halten, Interferenz nicht erhöhen
//  Memory schlecht / Mathe gut -> Merklast senken, Mathe halten, Interferenz separat (bei hoher Interferenz senken)
//  beide gut -> genau EINE Achse (die niedrigste) leicht erhöhen
//  beide schlecht -> Achsen senken, aber max −1 je Achse
function adaptComboLevels(memAcc,mathAcc,hadHighInterference){
  const p=ensureWmComboProfile();
  const memGood=memAcc>=0.75, mathGood=mathAcc>=0.7;
  let dMem=0,dIntf=0,dMath=0;
  if(memGood&&mathGood){
    const axes=[['mem',p.memoryLoadLevel],['intf',p.interferenceLevel],['math',p.mathDifficultyLevel]].sort((a,b)=>a[1]-b[1]);
    const up=axes[0][0]; if(up==='mem')dMem=1; else if(up==='intf')dIntf=1; else dMath=1;   // nur eine Achse
  } else if(memGood&&!mathGood){
    dMath=-1;                                             // Mathe senken; Merklast halten; Interferenz nicht erhöhen
  } else if(!memGood&&mathGood){
    dMem=-1; if(hadHighInterference)dIntf=-1;             // Merklast senken; Interferenz separat bewerten
  } else {
    dMem=-1; dMath=-1; if(hadHighInterference)dIntf=-1;   // beide schlecht: senken, max −1 je Achse
  }
  p.memoryLoadLevel    =clamp((p.memoryLoadLevel||1)+dMem,1,3);
  p.interferenceLevel  =clamp((p.interferenceLevel||1)+dIntf,1,3);
  p.mathDifficultyLevel=clamp((p.mathDifficultyLevel||1)+dMath,1,3);
  Store.persist();
  return {dMem,dIntf,dMath,mem:p.memoryLoadLevel,intf:p.interferenceLevel,math:p.mathDifficultyLevel};
}

/* ---- Item-Bau: drei unabhängige Achsen ---- */
function makeComboItem(opts){
  opts=opts||{};
  const p=ensureWmComboProfile();
  let memLevel =opts.memLevel !=null?opts.memLevel : p.memoryLoadLevel;     // fehlt -> adaptiv aus Profil
  let intfLevel=opts.intfLevel!=null?opts.intfLevel: p.interferenceLevel;
  let mathLevel=opts.mathLevel!=null?opts.mathLevel: p.mathDifficultyLevel;
  memLevel=clamp(memLevel,1,3); intfLevel=clamp(intfLevel,1,3); mathLevel=clamp(mathLevel,1,3);
  let dur=0;
  if(opts.daily){                                                          // Tagestraining: kompakt + Interferenz nach Dauer deckeln
    dur=opts.dailyDuration||10;
    memLevel=clamp(memLevel,1,2);
    intfLevel=clamp(intfLevel,1,dur<=5?2:3);                              // 5 min: max mittel; 10/15 min: bis hoch
  }
  const memCfg=COMBO_MEM[memLevel];
  const count=rnd(memCfg.count[0],memCfg.count[1]);
  const contentMode=pick(memCfg.contents);
  const order=memCfg.order();
  const els=comboMakeElements(contentMode,count);
  let nMath=rnd(COMBO_INTF[intfLevel][0],COMBO_INTF[intfLevel][1]);
  if(opts.daily)nMath=clamp(nMath,1,dur<=5?3:4);                          // Block sprengt das Tagestraining nicht
  const mathQs=Array.from({length:nMath},()=>comboMathQ(mathLevel));
  const showMs=clamp(1000+els.length*(contentMode==='words'?1100:contentMode==='mixed'?1000:900),2000,8000);
  return {render:'combo',cat:'wm:combo',group:'wm',diff:memLevel,
    memLevel:memLevel,intfLevel:intfLevel,mathLevel:mathLevel,contentMode:contentMode,order:order,
    els:els,mathQs:mathQs,showMs:showMs,daily:!!opts.daily,
    prompt:'Kombi-Memory \u00b7 '+els.length+' '+comboContentNoun(contentMode)+' merken',
    q:'Kombi-Memory ('+els.length+' Elemente \u00b7 '+nMath+' Ablenkung'+(nMath>1?'en':'')+')'};
}

/* ---- Auswertung des Abrufs ---- */
function comboNormToken(type,raw){
  raw=(raw==null?'':String(raw)).trim();
  if(type==='number'){const n=parseNum(raw); return isNaN(n)?('?'+raw.toLowerCase()):('#'+n);}
  if(type==='code'){return 'c:'+norm(raw);}
  return 'w:'+raw.toLowerCase().replace(/\s+/g,'');
}
// given: [{type?, raw}]. Bei Reihenfolge zaehlt -> positionsweise mit Typ.
// Sonst -> Multiset ueber alle Typ-Normalisierungen (typ-tolerant, gut fuer Gemischt).
function comboEvaluate(item,given){
  const els=item.els;
  let perOk,memoryOk;
  if(item.order){
    perOk=els.map((e,i)=> i<given.length && comboNormToken(e.type,given[i].raw)===comboNormToken(e.type,e.val));
    memoryOk = given.length===els.length && perOk.every(Boolean);
  } else {
    const remaining=els.map(e=>comboNormToken(e.type,e.val));
    perOk=els.map(()=>false);
    given.forEach(g=>{
      const cands=[comboNormToken('word',g.raw),comboNormToken('number',g.raw),comboNormToken('code',g.raw)];
      for(let ti=0;ti<remaining.length;ti++){ if(remaining[ti]!==null&&cands.indexOf(remaining[ti])>=0){remaining[ti]=null; perOk[ti]=true; break;} }
    });
    memoryOk = perOk.every(Boolean) && given.filter(g=>String(g.raw).trim()!=='').length===els.length;
  }
  return {perOk:perOk,memoryOk:memoryOk,expected:els.map(e=>e.val),given:given.map(g=>g.raw)};
}
function comboFeedbackText(result,item){
  if(result.memoryOk && result.mathTotal && result.mathCorrect===result.mathTotal) return 'Stark \u2013 Merken und Ablenkung beide sauber. Die Schwierigkeit zieht langsam an.';
  if(!result.memoryOk && result.mathCorrect<result.mathTotal) return 'Merken und Ablenkungsmathe waren beide wacklig \u2013 wir halten die Stufe, bleib dran.';
  if(!result.memoryOk) return 'Die Ablenkung hat das Gemerkte verdraengt \u2013 genau das trainiert Kombi-Memory. Der Merk-Umfang bleibt oder sinkt leicht.';
  if(result.mathTotal && result.mathCorrect<result.mathTotal) return 'Gut gemerkt! Bei der Ablenkungsmathe war eine Aufgabe daneben.';
  return 'Gut gemacht.';
}

/* ---- Block-Runner (drei Phasen), fuer Standalone UND Tagestraining ---- */
function runComboBlock(host,item,opts){
  opts=opts||{};
  const myToken=SESSION_TOKEN;
  const alive=()=>myToken===SESSION_TOKEN && document.body.contains(host);
  let phase='memorize';
  const mathResults=[];
  let recallStart=0;

  showMemorize();

  function showMemorize(){
    const chips=item.els.map(e=>'<span class="combo-el">'+e.val+'</span>').join('');
    host.innerHTML=
      '<div class="qkind">Kombi-Memory \u00b7 Merken</div>'+
      '<div class="q-text" style="text-align:center;color:var(--muted);margin-bottom:10px">Praege dir diese '+item.els.length+' '+comboContentNoun(item.contentMode)+' ein'+(item.order?' \u2013 in dieser Reihenfolge':'')+'.</div>'+
      '<div class="combo-list">'+chips+'</div>'+
      '<div class="combo-bar"><i id="cbar"></i></div>'+
      '<button class="btn" id="cgo" style="margin-top:18px">Bereit \u203a</button>';
    const bar=host.querySelector('#cbar');
    if(bar){ bar.style.transition='width '+item.showMs+'ms linear';
      const setW=()=>{if(alive())bar.style.width='100%';};
      if(typeof requestAnimationFrame==='function')requestAnimationFrame(setW); else setTimeout(setW,20); }
    const to=setTimeout(()=>{ if(alive()&&phase==='memorize')startInterference(); },item.showMs);
    const go=host.querySelector('#cgo');
    if(go)go.onclick=()=>{ clearTimeout(to); if(alive()&&phase==='memorize')startInterference(); };
  }

  function startInterference(){
    phase='interference';
    if(!item.mathQs.length)return startRecall();
    let mi=0;
    renderMath(mi);
    function renderMath(k){
      const q=item.mathQs[k], isMC=q.kind==='mc';
      host.innerHTML=
        '<div class="qkind">Ablenkung \u00b7 Aufgabe '+(k+1)+' / '+item.mathQs.length+'</div>'+
        (isMC?'<div class="q-text" style="text-align:center;font-size:22px;margin:6px 0 16px">'+q.prompt+'</div>':'<div class="q-math">'+q.prompt+'</div>')+
        '<div id="mzone"></div>'+
        '<div class="feedback" id="mfb"></div>';
      const zone=host.querySelector('#mzone');
      if(isMC){
        zone.innerHTML='<div class="opts">'+q.opts.map((o,i)=>'<button class="opt" data-k="'+i+'"><span class="key">'+'ABCD'[i]+'</span><span>'+o+'</span></button>').join('')+'</div>';
        zone.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
          const kk=+b.dataset.k, ok=kk===q.c;
          zone.querySelectorAll('.opt').forEach((x,xi)=>{x.disabled=true; if(xi===q.c)x.classList.add('correct'); if(xi===kk&&!ok)x.classList.add('wrong');});
          finishMath(ok, q.opts[q.c]);
        });
      } else {
        zone.innerHTML='<input class="num-input" id="mans" inputmode="numeric" autocomplete="off" placeholder="?"><button class="btn" id="msub" style="margin-top:12px">Pruefen</button>';
        const inp=zone.querySelector('#mans'); if(inp)inp.focus();
        const chk=()=>{ const raw=(inp.value||'').trim(); if(raw==='')return; inp.disabled=true;
          const ok=Math.abs(parseNum(raw)-q.answer)<1e-6; inp.style.borderColor=ok?'var(--good)':'var(--bad)';
          const sb=zone.querySelector('#msub'); if(sb)sb.style.display='none'; finishMath(ok, fmt(q.answer)); };
        if(inp)inp.addEventListener('keydown',e=>{ if(e.key==='Enter')chk(); });
        const sb=zone.querySelector('#msub'); if(sb)sb.onclick=chk;
      }
      function finishMath(ok,correctDisp){
        mathResults.push(!!ok);
        const ex=q.explain?('<div class="combo-res-note" style="margin-top:4px">'+q.explain+'</div>'):'';
        const fb=host.querySelector('#mfb'); if(fb){fb.className='feedback '+(ok?'good':'bad'); fb.innerHTML=(ok?'Richtig.':('Richtig: '+correctDisp))+ex;}
        const delay=q.explain?(ok?900:1600):(ok?550:1100);           // kurze Lesezeit fuer die Erklaerung
        setTimeout(()=>{ if(!alive())return; mi++; if(mi<item.mathQs.length)renderMath(mi); else startRecall(); }, delay);
      }
    }
  }

  function startRecall(){
    phase='recall'; recallStart=Date.now();
    if(item.contentMode==='words')renderChipsRecall(); else renderInputRecall();
  }

  function renderInputRecall(){
    const rows=item.els.map((e,i)=>
      '<div class="combo-recall-row"><span class="combo-idx">'+(i+1)+'</span>'+
      '<input class="combo-input" data-i="'+i+'" inputmode="'+(e.type==='number'?'numeric':'text')+'" autocomplete="off" autocapitalize="'+(e.type==='code'?'characters':'off')+'" placeholder="'+comboElNoun(e.type)+'"></div>').join('');
    host.innerHTML=
      '<div class="qkind">Abruf'+(item.order?' \u00b7 Reihenfolge zaehlt':' \u00b7 Reihenfolge egal')+'</div>'+
      '<div class="q-text" style="color:var(--muted);margin-bottom:14px">Gib die gemerkten '+comboContentNoun(item.contentMode)+' wieder.</div>'+
      '<div class="combo-recall">'+rows+'</div>'+
      '<button class="btn" id="csub" style="margin-top:16px">Pruefen</button>';
    const inputs=[].slice.call(host.querySelectorAll('.combo-input'));
    if(inputs[0])inputs[0].focus();
    inputs.forEach((inp,i)=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(i<inputs.length-1)inputs[i+1].focus(); else evaluateInputs(inputs);} }));
    const sub=host.querySelector('#csub'); if(sub)sub.onclick=()=>evaluateInputs(inputs);
  }
  function evaluateInputs(inputs){
    const given=inputs.map((inp,i)=>({type:item.els[i].type,raw:(inp.value||'').trim()}));
    finishBlock(comboEvaluate(item,given), given.map(g=>g.raw));
  }

  function renderChipsRecall(){
    const targets=item.els.map(e=>e.val), used=new Set(targets.map(v=>v.toUpperCase()));
    const dcount=clamp(item.els.length+2,4,8), distr=[]; let g=0;
    while(distr.length<dcount&&g++<300){const w=pick(COMBO_WORDS); if(!used.has(w.toUpperCase())){used.add(w.toUpperCase()); distr.push(w);}}
    const chipsVals=shuffle(targets.concat(distr));
    let selection=[];
    host.innerHTML=
      '<div class="qkind">Abruf'+(item.order?' \u00b7 Reihenfolge zaehlt':'')+'</div>'+
      '<div class="q-text" style="color:var(--muted);margin-bottom:6px">'+(item.order?'Tippe die W\u00f6rter in der richtigen Reihenfolge an.':'Tippe die '+item.els.length+' W\u00f6rter an, die du dir gemerkt hast.')+'</div>'+
      '<div class="combo-sel" id="csel"></div>'+
      '<div class="combo-chips" id="cchips">'+chipsVals.map(v=>'<button class="chip combo-chip" data-v="'+v+'" aria-pressed="false">'+v+'</button>').join('')+'</div>'+
      '<div class="btn-row"><button class="btn ghost" id="cundo">Zur\u00fcck</button><button class="btn" id="csub">Pruefen</button></div>';
    const selBox=host.querySelector('#csel');
    function refresh(){
      selBox.innerHTML=selection.length?selection.map((v,i)=>'<span class="combo-el">'+(item.order?(i+1)+'. ':'')+v+'</span>').join(''):'<span style="color:var(--faint);font-size:13px">\u2013 noch nichts gew\u00e4hlt \u2013</span>';
      host.querySelectorAll('.combo-chip').forEach(b=>b.setAttribute('aria-pressed', selection.indexOf(b.dataset.v)>=0?'true':'false'));
    }
    host.querySelectorAll('.combo-chip').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;
      if(item.order){ if(selection.length<item.els.length&&selection.indexOf(v)<0)selection.push(v); }
      else { const idx=selection.indexOf(v); if(idx>=0)selection.splice(idx,1); else if(selection.length<item.els.length)selection.push(v); }
      refresh();
    });
    const undo=host.querySelector('#cundo'); if(undo)undo.onclick=()=>{selection.pop(); refresh();};
    const sub=host.querySelector('#csub'); if(sub)sub.onclick=()=>{
      finishBlock(comboEvaluate(item,selection.map(v=>({type:'word',raw:v}))), selection.slice());
    };
    refresh();
  }

  function finishBlock(memRes,givenDisplay){
    const mathTotal=item.mathQs.length, mathCorrect=mathResults.filter(Boolean).length;
    const recallMs=recallStart?Date.now()-recallStart:0;
    const result={memoryOk:memRes.memoryOk,perOk:memRes.perOk,mathCorrect:mathCorrect,mathTotal:mathTotal,recallMs:recallMs,expected:memRes.expected,given:givenDisplay};
    const rightList=item.els.map((e,i)=>'<span class="combo-el '+(result.perOk[i]?'ok':'no')+'">'+e.val+'</span>').join('');
    const mathCls=(mathTotal&&mathCorrect===mathTotal)?'good':(mathCorrect>0?'':'bad');
    host.innerHTML=
      '<div class="qkind">Ergebnis</div>'+
      '<div class="combo-res">'+
        '<div class="combo-res-line"><span>Gemerkt</span><b class="'+(result.memoryOk?'good':'bad')+'">'+(result.memoryOk?'richtig':'nicht vollst\u00e4ndig')+'</b></div>'+
        '<div class="combo-res-sub">'+rightList+'</div>'+
        '<div class="combo-res-line"><span>Ablenkung (Mathe)</span><b class="'+mathCls+'">'+mathCorrect+' / '+mathTotal+'</b></div>'+
        '<div class="combo-res-note">'+comboFeedbackText(result,item)+'</div>'+
      '</div>'+
      '<div class="feedback" id="fb"></div><div id="nextrow"></div>';
    if(opts.onComplete)opts.onComplete(result);
    const nr=host.querySelector('#nextrow');
    nr.innerHTML='<button class="btn" id="cnext" style="margin-top:8px">'+(opts.continueLabel||'Weiter')+'</button>';
    const btn=host.querySelector('#cnext');
    if(btn){ btn.onclick=()=>{ if(opts.onContinue)opts.onContinue(result); }; btn.focus(); }
  }
}

function resolveComboLevels(){
  const p=ensureWmComboProfile();
  if(comboCfg.adaptive)return {mem:p.memoryLoadLevel,intf:p.interferenceLevel,math:p.mathDifficultyLevel,adaptive:true};
  return {mem:comboCfg.mem,intf:comboCfg.intf,math:comboCfg.math,adaptive:false};   // manuell: nur diese Session
}
function comboSetup(){

function startCombo(){
  ensureWmComboProfile();
  const lv=resolveComboLevels();
  const total=5;
  comboSession={levels:lv,total:total,idx:0,memOks:0,mathC:0,mathT:0,recallSum:0,token:++SESSION_TOKEN};
  state={kind:'combo',token:comboSession.token,answered:false,correct:0,i:0,total:total,label:'Kombi-Memory',restart:()=>startCombo()};
  setHomeBtn(true); tag.textContent='kombi-memory';
  comboRunNext();
}
function comboRunNext(){
  const cs=comboSession; if(!cs)return;
  if(cs.idx>=cs.total)return comboResults();
  const n=cs.idx+1, prog=Math.round(cs.idx/cs.total*100);
  root.innerHTML='<div class="card">'+
    '<div class="session-top"><span>Block '+n+' / '+cs.total+'</span><span class="streak '+(cs.memOks?'':'cold')+'">'+cs.memOks+' gemerkt</span></div>'+
    '<div class="progress"><i style="width:'+prog+'%"></i></div>'+
    '<div class="qwrap" id="qbody"></div></div>';
  const host=document.getElementById('qbody');
  const item=makeComboItem({memLevel:cs.levels.mem, intfLevel:cs.levels.intf, mathLevel:cs.levels.math});
  state.answered=false; state.i=cs.idx;
  runComboBlock(host,item,{
    continueLabel: cs.idx>=cs.total-1?'Auswertung':'Weiter',
    onComplete:(r)=>{
      state.answered=true;
      if(r.memoryOk){cs.memOks++; state.correct++;}
      cs.mathC+=r.mathCorrect; cs.mathT+=r.mathTotal; cs.recallSum+=r.recallMs;
      updateAdaptiveProfile({key:'wm:combo',group:'wm',ok:r.memoryOk,difficulty:item.memLevel,timeMs:r.recallMs});
      updateWmComboProfile(r,item);
    },
    onContinue:()=>{ cs.idx++; comboRunNext(); }
  });
}
function comboResults(){
  const cs=comboSession; if(!cs)return;
  setHomeBtn(false); tag.textContent='auswertung';
  Streak.registerToday();
  const memAcc=cs.total?cs.memOks/cs.total:0, mathAcc=cs.mathT?cs.mathC/cs.mathT:1;
  const chg=adaptComboLevels(memAcc,mathAcc, cs.levels.intf>=2);   // Interferenz besonders nach mehreren Aufgaben bewerten
  const p=ensureWmComboProfile();
  const acc=Math.round(memAcc*100);
  const v=acc>=90?'Stark.':acc>=70?'Solide.':acc>=50?'Geht voran.':'Dranbleiben.';
  const raised=chg.dMem>0||chg.dIntf>0||chg.dMath>0, lowered=chg.dMem<0||chg.dIntf<0||chg.dMath<0;
  const loadNote=raised?'Schwierigkeit leicht erh\u00f6ht \u2191':(lowered?'Schwierigkeit etwas gesenkt \u2193':'Schwierigkeit gehalten');
  root.innerHTML='<div class="card">'+
    '<div class="res-score">'+cs.memOks+'<small>/'+cs.total+'</small></div>'+
    '<div class="res-label">'+v+' Kombi-Memory</div>'+
    '<div class="res-grid">'+
      '<div class="res-cell"><b>'+acc+'%</b><span>gemerkt</span></div>'+
      '<div class="res-cell"><b>'+(cs.mathT?Math.round(mathAcc*100)+'%':'\u2013')+'</b><span>Ablenkung</span></div>'+
      '<div class="res-cell"><b>'+(cs.total?(Math.round(cs.recallSum/cs.total/100)/10):0)+'s</b><span>\u00d8 Abruf</span></div></div>'+
    '<div class="res-note">Profil: Merklast '+COMBO_MEM_LABEL[p.memoryLoadLevel]+' \u00b7 Interferenz '+COMBO_INTF_LABEL[p.interferenceLevel]+' \u00b7 Mathe '+COMBO_MATH_LABEL[p.mathDifficultyLevel]+' \u00b7 '+loadNote+'</div>'+
    (cs.levels.adaptive?'':'<div class="res-note">Diese Session war manuell ('+COMBO_MEM_LABEL[cs.levels.mem]+' / '+COMBO_INTF_LABEL[cs.levels.intf]+' / '+COMBO_MATH_LABEL[cs.levels.math]+') \u2013 dein Profil wurde nur anhand der Leistung angepasst.</div>')+
    '<div class="btn-row"><button class="btn ghost" id="hm">Startseite</button><button class="btn" id="rt">Nochmal</button></div></div>';
  document.getElementById('hm').onclick=resetToHome;
  document.getElementById('rt').onclick=()=>comboSetup();
  comboSession=null;
}

function fillCombo(q){
  const host=document.getElementById('qbody');
  runComboBlock(host,q,{
    continueLabel: state.i>=state.total-1?'Auswertung':'Weiter',
    onComplete:(r)=>{
      state.answered=true;
      const ok=r.memoryOk;
      ok?(state.correct++,state.streak++):(state.streak=0);
      record(q,ok);                                   // areaLog['wm'] + updateAdaptiveProfile('wm:combo')
      updateWmComboProfile(r,q);                       // Genauigkeit/recentSessions – Level-Anpassung nur in Standalone-Sessions
      pushReview(q,ok, (r.given.filter(x=>String(x).trim()!=='').join(' \u00b7 '))||'\u2013', r.expected.join(' \u00b7 '));
    },
    onContinue: next
  });
}

function startCountdown(stage,alive,go){

    setTimeout(()=>{ if(!alive())return; stage.textContent='Los!';
      setTimeout(()=>{ if(!alive())return; stage.textContent=''; setTimeout(go,250); }, 600);
    }, 850);
  }, 250);
}
